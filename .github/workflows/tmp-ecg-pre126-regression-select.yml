name: TEMP MEDCALC ECG pre126 regression selector

on:
  push:
    branches:
      - "tmp/ecg-pre126-regression-select"

permissions:
  contents: read

jobs:
  select-known-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Select pre-fix RBBB reasoner losses
        run: |
          python ecg_development_regression_case_selector.py             --target RBBB_COMPLETE             --stage FUSION_TO_FINAL_LOSS             --folds 1,2,3,4,5,6,7,8             --max-cases 3             --output /tmp/PRE126_RBBB_KNOWN_CASES.json
      - name: Select pre-fix LBBB reasoner losses
        run: |
          python ecg_development_regression_case_selector.py             --target LBBB             --stage FUSION_TO_FINAL_LOSS             --folds 1,2,3,4,5,6,7,8             --max-cases 3             --output /tmp/PRE126_LBBB_KNOWN_CASES.json
      - name: Upload selected development cases
        uses: actions/upload-artifact@v4
        with:
          name: pre126-known-development-cases-${{ github.sha }}
          path: |
            /tmp/PRE126_RBBB_KNOWN_CASES.json
            /tmp/PRE126_LBBB_KNOWN_CASES.json
          if-no-files-found: error
          retention-days: 7
