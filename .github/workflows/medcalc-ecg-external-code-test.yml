name: MEDCALC ECG CODE-test consumed-baseline lock

on:
  workflow_dispatch:

jobs:
  verify-baseline-is-locked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify CODE-test cannot be reused as external validation
        run: |
          python ecg_validation_guard_selftest.py
          if python ecg_validation_guard.py --external code_test; then
            echo "ERROR: CODE-test was incorrectly re-enabled as external validation."
            exit 1
          fi
          echo "CODE-test remains a historical frozen baseline only."
