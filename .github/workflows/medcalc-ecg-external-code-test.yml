name: MEDCALC ECG frozen external CODE-test

on:
  push:
    branches: [main]
    paths:
      - "ecg_external_code_test.py"
      - "ecg_dataset_provenance.json"
      - "ecg_validation_guard.py"
      - ".github/workflows/medcalc-ecg-external-code-test.yml"
  workflow_dispatch:
    inputs:
      max_records:
        description: "0 = full frozen set; use nonzero only for infrastructure smoke, never threshold tuning"
        required: false
        default: "0"

jobs:
  frozen-code-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install external-validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scipy==1.16.3 \
            wfdb==4.3.0 \
            neurokit2==0.2.13 \
            h5py

      - name: Verify dataset provenance lock
        run: |
          python ecg_validation_guard.py --external code_test

      - name: Download frozen CODE-test dataset
        run: |
          mkdir -p /tmp/code-test
          curl -L --fail --retry 4 \
            "https://zenodo.org/records/3765780/files/data.zip?download=1" \
            -o /tmp/code-test/data.zip
          unzip -q /tmp/code-test/data.zip -d /tmp/code-test
          find /tmp/code-test -maxdepth 3 -type f | sort | head -50

      - name: Run frozen external validation
        env:
          MANUAL_MAX_RECORDS: ${{ github.event.inputs.max_records || '0' }}
        run: |
          DATA_DIR="/tmp/code-test/data"
          if [ ! -f "$DATA_DIR/ecg_tracings.hdf5" ]; then
            DATA_DIR="/tmp/code-test"
          fi
          python ecg_external_code_test.py \
            --data-dir "$DATA_DIR" \
            --output-dir /tmp/medcalc-code-test-results \
            --max-records "$MANUAL_MAX_RECORDS"

      - name: Print frozen external summary
        if: always()
        run: |
          if [ -f /tmp/medcalc-code-test-results/code_test_summary.json ]; then
            cat /tmp/medcalc-code-test-results/code_test_summary.json
          fi

      - name: Upload frozen external results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-code-test-frozen-${{ github.sha }}
          path: /tmp/medcalc-code-test-results
          retention-days: 30
          if-no-files-found: warn
