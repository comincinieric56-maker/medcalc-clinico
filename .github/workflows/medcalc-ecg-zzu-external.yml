name: MEDCALC ECG ZZU historical baseline integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_dataset_provenance.json"
      - "ecg_external_validation_results/ZZU_PECG_PEDIATRIC_DIAGNOSTIC_V1.json"
      - ".github/workflows/medcalc-ecg-zzu-external.yml"

permissions:
  contents: read

jobs:
  consumed-baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify ZZU is permanently consumed
        run: |
          python ecg_validation_guard.py --consumed zzu_pecg

      - name: Verify frozen aggregate baseline evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("ecg_dataset_provenance.json").read_text())
          r=json.loads(Path("ecg_external_validation_results/ZZU_PECG_PEDIATRIC_DIAGNOSTIC_V1.json").read_text())

          rows={x["id"]:x for x in p["external_baseline_consumed"]}
          z=rows["zzu_pecg"]

          assert z["status"]=="EXTERNAL_BASELINE_CONSUMED", z
          assert z["external_validation_allowed"] is False, z
          assert z["allow_tuning"] is False, z
          assert z["allow_threshold_selection"] is False, z
          assert z["allow_debugging_on_individual_test_labels"] is False, z
          assert z["baseline_workflow_run_id"]==36478989934, z
          assert z["baseline_result_artifact_id"]==10994607246, z
          assert z["baseline_result_artifact_digest"]=="sha256:eede39d88d2a2bd21e9b12093a52752314b5892beb22ad62bc30298bd558e9e1", z

          assert r["status"]=="EXTERNAL_BASELINE_CONSUMED", r
          assert r["clinical_engine_baseline_sha"]=="7b03f1ada34c93246ec9b72fa63284269d2564ab", r
          assert r["patients_scored"]==10355, r
          assert r["records_scored"]==10355, r
          assert r["analysis_failure_rate"]==0.0, r
          assert r["age_parse_rate"]==1.0, r
          assert r["gold_positive_total"]==3449, r
          assert r["anti_leakage"]["threshold_tuning_allowed"] is False, r
          assert r["anti_leakage"]["individual_record_debugging_allowed"] is False, r
          assert r["anti_leakage"]["inference_rerun_for_parser_correction"] is False, r
          print("MEDCALC_ZZU_HISTORICAL_BASELINE_INTEGRITY_PASS")
          PY

      - name: Prohibit re-execution as external validation
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/medcalc-ecg-zzu-external.yml").read_text()
          assert "workflow_dispatch:" not in text
          assert "\n  push:" not in text
          print("MEDCALC_ZZU_REEXECUTION_DISABLED")
          PY
