name: MEDCALC ECG LPFB specialist gate audit

on:
  push:
    branches:
      - audit/ecg-lpfb-specialist-safety-gate
  workflow_dispatch:

concurrency:
  group: medcalc-ecg-lpfb-specialist-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lpfb-gate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_lpfb_specialist_gate_audit.py
      - name: Run LPFB specialist gate audit
        run: |
          python ecg_lpfb_specialist_gate_audit.py             --workdir /tmp/medcalc-lpfb-gate             --output /tmp/MEDCALC_LPFB_GATE.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-lpfb-specialist-gate-${{ github.sha }}
          path: /tmp/MEDCALC_LPFB_GATE.json
          if-no-files-found: error
          retention-days: 30
