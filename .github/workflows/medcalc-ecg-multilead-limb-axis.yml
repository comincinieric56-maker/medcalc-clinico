name: MEDCALC ECG multilead limb-axis audit

on:
  push:
    branches:
      - audit/ecg-multilead-limb-axis
  workflow_dispatch:

concurrency:
  group: medcalc-ecg-multilead-limb-axis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axis-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_multilead_limb_axis_audit.py
      - name: Run multilead limb-axis audit
        run: |
          python ecg_multilead_limb_axis_audit.py             --workdir /tmp/medcalc-axis-audit             --output /tmp/MEDCALC_AXIS_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-multilead-limb-axis-${{ github.sha }}
          path: /tmp/MEDCALC_AXIS_AUDIT.json
          if-no-files-found: error
          retention-days: 30
