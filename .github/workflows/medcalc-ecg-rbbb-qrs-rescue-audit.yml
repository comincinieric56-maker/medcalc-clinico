name: MEDCALC ECG RBBB QRS rescue audit

on:
  push:
    branches: [ecg-rbbb-qrs-rescue-audit]
    paths:
      - "ecg_rbbb_qrs_rescue_audit.py"
      - ".github/workflows/medcalc-ecg-rbbb-qrs-rescue-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-rbbb-qrs-rescue-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-rbbb-qrs-${{ matrix.fold }}
      - name: Run RBBB rescue audit fold ${{ matrix.fold }}
        run: |
          python ecg_rbbb_qrs_rescue_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-rbbb-qrs-${{ matrix.fold }} \
            --output /tmp/RBBB_QRS_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rbbb-qrs-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/RBBB_QRS_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rbbb-qrs-fold-*-${{ github.sha }}
          path: /tmp/rbbb-qrs
          merge-multiple: false
      - name: Aggregate RBBB rescue audit
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path("/tmp/rbbb-qrs").glob("**/*.json"))
          assert len(files)==8, files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]
          groups={}
          for group in ("RBBB_COMPLETE","CONTROL"):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in ((d.get("groups") or {}).get(group) or {}).items()})
              groups[group]=dict(c)
          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})
          p=groups["RBBB_COMPLETE"]; n=groups["CONTROL"]
          baseline_tp=int(p.get("final_published_n") or 0)
          rescue_tp=int(p.get("safe_rescue_n") or 0)
          baseline_fp=int(n.get("final_published_n") or 0)
          rescue_fp=int(n.get("safe_rescue_n") or 0)
          pos_n=int(p.get("n") or 0); neg_n=int(n.get("n") or 0)
          out={
            "version":"MEDCALC_RBBB_QRS_RESCUE_AUDIT_V1_AGGREGATE",
            "dataset":"PTB-XL","role":"DEVELOPMENT_TUNING_ONLY","folds":[1,2,3,4,5,6,7,8],
            "fast_gate_holdout_excluded":True,"external_validation_claim_allowed":False,
            "groups":groups,
            "analysis_error_n":sum(errors.values()),
            "analysis_error_types":dict(errors),
            "projection":{
              "baseline_tp_n":baseline_tp,
              "rescue_tp_n":rescue_tp,
              "projected_tp_n":baseline_tp+rescue_tp,
              "positive_n":pos_n,
              "baseline_sensitivity":baseline_tp/pos_n if pos_n else None,
              "projected_sensitivity":(baseline_tp+rescue_tp)/pos_n if pos_n else None,
              "baseline_fp_n":baseline_fp,
              "incremental_fp_n":rescue_fp,
              "projected_fp_n":baseline_fp+rescue_fp,
              "negative_control_n":neg_n,
              "baseline_specificity":1.0-baseline_fp/neg_n if neg_n else None,
              "projected_specificity":1.0-(baseline_fp+rescue_fp)/neg_n if neg_n else None,
              "specificity_guardrail":0.90
            },
            "clinical_output_changed":False,
            "policy":"COUNTERFACTUAL_AUDIT_ONLY; QRS_ONLY_ABSTENTION; NO_BLOCKING_CONFLICT; GE3_QRS120_DISTRIBUTED; GE4_QRS118; FULL_RBBB_MORPHOLOGY; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL"
          }
          Path("/tmp/RBBB_QRS_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rbbb-qrs-aggregate-${{ github.sha }}
          path: /tmp/RBBB_QRS_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
