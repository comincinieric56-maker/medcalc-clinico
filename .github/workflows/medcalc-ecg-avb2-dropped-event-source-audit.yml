name: MEDCALC ECG AVB2 dropped-event source audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
    paths:
      - "ecg_avb2_dropped_event_source_audit.py"
      - ".github/workflows/medcalc-ecg-avb2-dropped-event-source-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb2-dropped-event-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  avb2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-drop-source
      - name: Run AVB2 dropped-event source audit
        run: |
          python ecg_avb2_dropped_event_source_audit.py \
            --workdir /tmp/medcalc-avb2-drop-source \
            --output /tmp/AVB2_DROPPED_EVENT_SOURCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-dropped-event-source-${{ github.sha }}
          path: /tmp/AVB2_DROPPED_EVENT_SOURCE.json
          if-no-files-found: error
          retention-days: 30
