name: MEDCALC ECG AVB2 dropped-event source control audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
    paths:
      - "ecg_avb2_dropped_event_source_control_audit.py"
      - ".github/workflows/medcalc-ecg-avb2-dropped-event-source-control-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb2-dropped-source-controls-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-drop-source-control-${{ matrix.fold }}
      - name: Run dropped-event source controls fold ${{ matrix.fold }}
        run: |
          python ecg_avb2_dropped_event_source_control_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb2-drop-source-control-${{ matrix.fold }} \
            --output /tmp/AVB2_DROPPED_SOURCE_CONTROL_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-drop-source-control-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB2_DROPPED_SOURCE_CONTROL_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb2-drop-source-control-fold-*-${{ github.sha }}
          path: /tmp/avb2-drop-source-controls
          merge-multiple: false
      - name: Aggregate control source evidence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          files=sorted(Path("/tmp/avb2-drop-source-controls").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]

          def merge(key):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in (d.get(key) or {}).items()})
              return dict(c)

          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})

          out={
              "version":"MEDCALC_AVB2_DROPPED_EVENT_SOURCE_CONTROL_AUDIT_V1_AGGREGATE",
              "dataset":"PTB-XL",
              "role":"DEVELOPMENT_TUNING_ONLY",
              "folds":[1,2,3,4,5,6,7,8],
              "fast_gate_holdout_excluded":True,
              "external_validation_claim_allowed":False,
              "selection_control_n":sum(int(d.get("selection_control_n") or 0) for d in docs),
              "counts":merge("counts"),
              "source_event_counts":merge("source_event_counts"),
              "source_support_histogram":merge("source_support_histogram"),
              "per_case_dropped_count_histogram":merge("per_case_dropped_count_histogram"),
              "analysis_error_n":sum(errors.values()),
              "analysis_error_types":dict(errors),
              "policy":"AUDIT_ONLY; FIXED_NEGATIVE_CONTROLS; EXACT_EXISTING_36MS_COMBINED_EVENT_DEDUP_AND_70_550MS_QRS_TO_P_MAPPING; SOURCE_TAGGING_ONLY; NO_NEW_THRESHOLDS; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL",
          }
          Path("/tmp/AVB2_DROPPED_SOURCE_CONTROL_AGGREGATE.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-drop-source-control-aggregate-${{ github.sha }}
          path: /tmp/AVB2_DROPPED_SOURCE_CONTROL_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
