name: MEDCALC ECG LBBB morphology support audit

on:
  push:
    branches:
      - audit/ecg-lbbb-morphology-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lbbb-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_lbbb_morphology_support_audit.py
      - name: Run LBBB morphology audit
        run: |
          python ecg_lbbb_morphology_support_audit.py             --workdir /tmp/medcalc-lbbb-audit             --output /tmp/MEDCALC_LBBB_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-lbbb-morphology-support-${{ github.sha }}
          path: /tmp/MEDCALC_LBBB_AUDIT.json
          if-no-files-found: error
          retention-days: 30
