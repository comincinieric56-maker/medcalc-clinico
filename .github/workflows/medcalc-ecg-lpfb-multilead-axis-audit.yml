name: MEDCALC ECG LPFB multilead-axis audit

on:
  push:
    branches: [ecg-lpfb-multilead-axis-audit]
    paths:
      - "ecg_lpfb_multilead_axis_audit.py"
      - ".github/workflows/medcalc-ecg-lpfb-multilead-axis-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-lpfb-multilead-axis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-lpfb-axis-${{ matrix.fold }}
      - name: Run LPFB multilead-axis audit fold ${{ matrix.fold }}
        run: |
          python ecg_lpfb_multilead_axis_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-lpfb-axis-${{ matrix.fold }} \
            --output /tmp/LPFB_AXIS_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: lpfb-axis-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/LPFB_AXIS_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lpfb-axis-fold-*-${{ github.sha }}
          path: /tmp/lpfb-axis
          merge-multiple: false
      - name: Aggregate LPFB multilead-axis audit
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          files=sorted(Path("/tmp/lpfb-axis").glob("**/*.json"))
          assert len(files)==8, files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]

          groups={}
          for group in ("LPFB","CONTROL"):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in ((d.get("groups") or {}).get(group) or {}).items()})
              groups[group]=dict(c)

          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})

          p=groups["LPFB"]; n=groups["CONTROL"]
          baseline_tp=int(p.get("final_published_n") or 0)
          rescue_tp=int(p.get("safe_rescue_n") or 0)
          baseline_fp=int(n.get("final_published_n") or 0)
          rescue_fp=int(n.get("safe_rescue_n") or 0)
          pos_n=int(p.get("n") or 0); neg_n=int(n.get("n") or 0)

          out={
              "version":"MEDCALC_LPFB_MULTILEAD_AXIS_AUDIT_V1_AGGREGATE",
              "dataset":"PTB-XL",
              "role":"DEVELOPMENT_TUNING_ONLY",
              "folds":[1,2,3,4,5,6,7,8],
              "fast_gate_holdout_excluded":True,
              "external_validation_claim_allowed":False,
              "groups":groups,
              "analysis_error_n":sum(errors.values()),
              "analysis_error_types":dict(errors),
              "projection":{
                  "baseline_tp_n":baseline_tp,
                  "rescue_tp_n":rescue_tp,
                  "projected_tp_n":baseline_tp+rescue_tp,
                  "positive_n":pos_n,
                  "baseline_sensitivity":baseline_tp/pos_n if pos_n else None,
                  "projected_sensitivity":(baseline_tp+rescue_tp)/pos_n if pos_n else None,
                  "baseline_fp_n":baseline_fp,
                  "incremental_fp_n":rescue_fp,
                  "projected_fp_n":baseline_fp+rescue_fp,
                  "negative_control_n":neg_n,
                  "baseline_specificity":1.0-baseline_fp/neg_n if neg_n else None,
                  "projected_specificity":1.0-(baseline_fp+rescue_fp)/neg_n if neg_n else None,
                  "specificity_guardrail":0.90
              },
              "clinical_output_changed":False,
              "policy":"COUNTERFACTUAL_AUDIT_ONLY; EXISTING_LEAST_SQUARES_LIMB_AXIS; EXISTING_LPFB_THRESHOLDS; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL"
          }
          Path("/tmp/LPFB_AXIS_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lpfb-axis-aggregate-${{ github.sha }}
          path: /tmp/LPFB_AXIS_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
