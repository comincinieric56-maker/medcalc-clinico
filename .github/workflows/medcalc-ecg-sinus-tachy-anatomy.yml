name: MEDCALC ECG sinus tachycardia anatomy audit

on:
  push:
    branches:
      - audit/ecg-sinus-tachy-anatomy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sinus-tachy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_sinus_tachy_anatomy_audit.py
      - name: Run sinus tachycardia anatomy audit
        run: |
          python ecg_sinus_tachy_anatomy_audit.py             --workdir /tmp/medcalc-sinus-tachy             --output /tmp/MEDCALC_SINUS_TACHY_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-sinus-tachy-anatomy-${{ github.sha }}
          path: /tmp/MEDCALC_SINUS_TACHY_AUDIT.json
          if-no-files-found: error
          retention-days: 30
