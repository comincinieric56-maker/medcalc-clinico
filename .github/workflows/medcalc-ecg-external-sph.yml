name: MEDCALC ECG frozen external SPH

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_sph_prepare.py"
      - "ecg_sph_infer.py"
      - "ecg_sph_score.py"
      - ".github/workflows/medcalc-ecg-external-sph.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify SPH remains externally locked
        run: python ecg_validation_guard.py --external sph

      - name: Download SPH metadata, dictionary and records
        run: |
          mkdir -p /tmp/sph-source
          curl -L --fail --retry 4 \
            "https://springernature.figshare.com/ndownloader/files/34793152" \
            -o /tmp/sph-source/metadata.csv
          curl -L --fail --retry 4 \
            "https://springernature.figshare.com/ndownloader/files/32630954" \
            -o /tmp/sph-source/code.csv
          curl -L --fail --retry 4 \
            "https://springernature.figshare.com/ndownloader/files/32630684" \
            -o /tmp/sph-source/records.tar
          test -s /tmp/sph-source/metadata.csv
          test -s /tmp/sph-source/code.csv
          test -s /tmp/sph-source/records.tar

      - name: Freeze label-blind 5 percent patient subset and shard waveforms
        run: |
          python ecg_sph_prepare.py \
            --metadata /tmp/sph-source/metadata.csv \
            --code /tmp/sph-source/code.csv \
            --records-tar /tmp/sph-source/records.tar \
            --output-dir /tmp/sph-prepared \
            --patient-modulus 20 \
            --patient-remainder 0 \
            --shards 8
          cp /tmp/sph-prepared/selection_summary.json /tmp/sph-prepared/gold/

      - name: Upload isolated SPH gold
        uses: actions/upload-artifact@v4
        with:
          name: sph-frozen-gold
          path: /tmp/sph-prepared/gold
          retention-days: 1
          if-no-files-found: error

      - name: Upload signal shard 00
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-00
          path: /tmp/sph-prepared/artifact-00
          retention-days: 1
      - name: Upload signal shard 01
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-01
          path: /tmp/sph-prepared/artifact-01
          retention-days: 1
      - name: Upload signal shard 02
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-02
          path: /tmp/sph-prepared/artifact-02
          retention-days: 1
      - name: Upload signal shard 03
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-03
          path: /tmp/sph-prepared/artifact-03
          retention-days: 1
      - name: Upload signal shard 04
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-04
          path: /tmp/sph-prepared/artifact-04
          retention-days: 1
      - name: Upload signal shard 05
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-05
          path: /tmp/sph-prepared/artifact-05
          retention-days: 1
      - name: Upload signal shard 06
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-06
          path: /tmp/sph-prepared/artifact-06
          retention-days: 1
      - name: Upload signal shard 07
        uses: actions/upload-artifact@v4
        with:
          name: sph-signal-shard-07
          path: /tmp/sph-prepared/artifact-07
          retention-days: 1

  infer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["00","01","02","03","04","05","06","07"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install digital ECG inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scipy==1.16.3 \
            wfdb==4.3.0 \
            neurokit2==0.2.13 \
            h5py

      - name: Verify SPH provenance lock
        run: python ecg_validation_guard.py --external sph

      - name: Download waveform shard only
        uses: actions/download-artifact@v4
        with:
          name: sph-signal-shard-${{ matrix.shard }}
          path: /tmp/sph-shard

      - name: Run label-isolated SPH inference
        run: |
          python ecg_sph_infer.py \
            --artifact-dir /tmp/sph-shard \
            --output /tmp/sph-predictions/predictions-${{ matrix.shard }}.csv

      - name: Upload prediction shard
        uses: actions/upload-artifact@v4
        with:
          name: sph-predictions-${{ matrix.shard }}
          path: /tmp/sph-predictions/predictions-${{ matrix.shard }}.csv
          retention-days: 30
          if-no-files-found: error

  score:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install scoring runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3

      - name: Verify SPH provenance lock
        run: python ecg_validation_guard.py --external sph

      - name: Download all prediction shards
        uses: actions/download-artifact@v4
        with:
          pattern: sph-predictions-*
          path: /tmp/sph-predictions
          merge-multiple: true

      - name: Download isolated gold only after all inference shards
        uses: actions/download-artifact@v4
        with:
          name: sph-frozen-gold
          path: /tmp/sph-gold

      - name: Score frozen SPH subset
        run: |
          python ecg_sph_score.py \
            --predictions-dir /tmp/sph-predictions \
            --gold /tmp/sph-gold/gold.csv \
            --code /tmp/sph-gold/code.csv \
            --selection-summary /tmp/sph-gold/selection_summary.json \
            --output-dir /tmp/sph-results

      - name: Print frozen SPH summary
        run: cat /tmp/sph-results/sph_summary.json

      - name: Upload frozen SPH results
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-sph-frozen-${{ github.sha }}
          path: /tmp/sph-results
          retention-days: 30
          if-no-files-found: error
