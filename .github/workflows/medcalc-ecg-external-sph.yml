name: MEDCALC ECG SPH consumed-baseline lock

on:
  workflow_dispatch:

jobs:
  verify-sph-baseline-is-locked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPH cannot be reused as external validation
        run: |
          python ecg_validation_guard_selftest.py
          if python ecg_validation_guard.py --external sph; then
            echo "ERROR: SPH was incorrectly re-enabled as external validation."
            exit 1
          fi
          python ecg_validation_guard.py --external mimic_iv_ecg
          echo "SPH remains a historical frozen baseline; MIMIC-IV-ECG remains untouched."
