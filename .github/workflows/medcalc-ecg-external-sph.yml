name: MEDCALC ECG frozen external SPH

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_external_sph_prepare.py"
      - "ecg_external_sph_shard.py"
      - "ecg_external_sph_score.py"
      - ".github/workflows/medcalc-ecg-external-sph.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install preparation runtime
        run: python -m pip install pandas==2.2.3

      - name: Verify SPH is still frozen external
        run: python ecg_validation_guard.py --external sph

      - name: Download official SPH release
        run: |
          mkdir -p /tmp/sph-download
          curl -L --fail --retry 5             "https://springernature.figshare.com/ndownloader/files/34793152"             -o /tmp/sph-download/metadata.csv
          curl -L --fail --retry 5             "https://springernature.figshare.com/ndownloader/files/32630954"             -o /tmp/sph-download/code.csv
          curl -L --fail --retry 5             "https://springernature.figshare.com/ndownloader/files/32630684"             -o /tmp/sph-download/records.tar
          tar -xf /tmp/sph-download/records.tar -C /tmp/sph-download
          RECORDS_DIR="$(find /tmp/sph-download -type f -name 'A00001.h5' -printf '%h
' | head -1)"
          test -n "$RECORDS_DIR"
          echo "RECORDS_DIR=$RECORDS_DIR" >> "$GITHUB_ENV"

      - name: Freeze patient-level SPH cohorts before inference
        run: |
          python ecg_external_sph_prepare.py             --metadata /tmp/sph-download/metadata.csv             --code /tmp/sph-download/code.csv             --records-dir "$RECORDS_DIR"             --output-dir /tmp/sph-prepared             --general-patients 2000             --negative-control-patients 2000             --shards 8

      - name: Print selection audit
        run: cat /tmp/sph-prepared/sph_selection_summary.json

      - name: Upload isolated gold
        uses: actions/upload-artifact@v4
        with:
          name: sph-gold
          path: /tmp/sph-prepared/gold
          retention-days: 2
          if-no-files-found: error

      - name: Upload selection audit
        uses: actions/upload-artifact@v4
        with:
          name: sph-selection-audit
          path: /tmp/sph-prepared/sph_selection_summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload shard 00
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-00
          path: /tmp/sph-prepared/shards/sph-shard-00.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 01
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-01
          path: /tmp/sph-prepared/shards/sph-shard-01.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 02
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-02
          path: /tmp/sph-prepared/shards/sph-shard-02.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 03
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-03
          path: /tmp/sph-prepared/shards/sph-shard-03.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 04
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-04
          path: /tmp/sph-prepared/shards/sph-shard-04.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 05
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-05
          path: /tmp/sph-prepared/shards/sph-shard-05.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 06
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-06
          path: /tmp/sph-prepared/shards/sph-shard-06.tar
          retention-days: 2
          if-no-files-found: error
      - name: Upload shard 07
        uses: actions/upload-artifact@v4
        with:
          name: sph-shard-07
          path: /tmp/sph-prepared/shards/sph-shard-07.tar
          retention-days: 2
          if-no-files-found: error

  infer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["00","01","02","03","04","05","06","07"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install MEDCALC digital-signal runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install             numpy==2.1.3             pandas==2.2.3             scipy==1.16.3             wfdb==4.3.0             neurokit2==0.2.13             h5py

      - name: Verify SPH provenance lock
        run: python ecg_validation_guard.py --external sph

      - name: Download waveform shard only
        uses: actions/download-artifact@v4
        with:
          name: sph-shard-${{ matrix.shard }}
          path: /tmp/sph-shard

      - name: Extract waveform shard
        run: |
          mkdir -p /tmp/sph-work
          tar -xf /tmp/sph-shard/sph-shard-${{ matrix.shard }}.tar -C /tmp/sph-work
          test -f /tmp/sph-work/manifest.csv
          test -d /tmp/sph-work/records

      - name: Run label-isolated SPH inference
        run: |
          python ecg_external_sph_shard.py             --root /tmp/sph-work             --output /tmp/sph-predictions/predictions-${{ matrix.shard }}.csv

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: sph-predictions-${{ matrix.shard }}
          path: /tmp/sph-predictions/predictions-${{ matrix.shard }}.csv
          retention-days: 30
          if-no-files-found: error

  score:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install scoring runtime
        run: python -m pip install numpy==2.1.3 pandas==2.2.3

      - name: Verify SPH provenance lock before opening gold
        run: python ecg_validation_guard.py --external sph

      - name: Download all inference predictions
        uses: actions/download-artifact@v4
        with:
          pattern: sph-predictions-*
          path: /tmp/sph-predictions
          merge-multiple: true

      - name: Download selection audit
        uses: actions/download-artifact@v4
        with:
          name: sph-selection-audit
          path: /tmp/sph-selection

      - name: Download isolated gold only after every inference shard completed
        uses: actions/download-artifact@v4
        with:
          name: sph-gold
          path: /tmp/sph-gold

      - name: Score frozen SPH external benchmark
        run: |
          python ecg_external_sph_score.py             --predictions-dir /tmp/sph-predictions             --gold /tmp/sph-gold/sph_gold.csv             --selection-summary /tmp/sph-selection/sph_selection_summary.json             --output-dir /tmp/sph-results

      - name: Print SPH summary
        run: cat /tmp/sph-results/sph_summary.json

      - name: Upload frozen SPH results
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-sph-frozen-${{ github.sha }}
          path: /tmp/sph-results
          retention-days: 30
          if-no-files-found: error
