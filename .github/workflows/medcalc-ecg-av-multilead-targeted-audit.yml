name: MEDCALC ECG AV multilead targeted audit

on:
  push:
    branches:
      - audit/ecg-av-multilead-concordance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  av-multilead-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_av_multilead_targeted_audit.py
      - name: Run AVB2 AVB3 multilead audit
        run: |
          python ecg_av_multilead_targeted_audit.py             --workdir /tmp/medcalc-av-multilead-audit             --output /tmp/MEDCALC_AV_MULTILEAD_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-av-multilead-audit-${{ github.sha }}
          path: /tmp/MEDCALC_AV_MULTILEAD_AUDIT.json
          if-no-files-found: error
          retention-days: 30
