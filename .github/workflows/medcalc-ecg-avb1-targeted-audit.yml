name: MEDCALC ECG AVB1 targeted audit

on:
  push:
    branches:
      - audit/ecg-avb1-compound-pr-rescue
    paths:
      - "ecg_adult_diagnostic_dev_benchmark.py"
      - "ecg_avb1_targeted_audit.py"
      - ".github/workflows/medcalc-ecg-avb1-targeted-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avb1-targeted-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Benchmark parser/selftest
        run: python ecg_adult_diagnostic_dev_benchmark.py --selftest
      - name: Run targeted AVB1 audit
        run: |
          python ecg_avb1_targeted_audit.py             --workdir /tmp/medcalc-avb1-targeted-audit             --output /tmp/MEDCALC_AVB1_TARGETED_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-avb1-targeted-audit-${{ github.sha }}
          path: /tmp/MEDCALC_AVB1_TARGETED_AUDIT.json
          if-no-files-found: error
          retention-days: 30
