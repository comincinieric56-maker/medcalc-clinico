name: MEDCALC Pregnancy openFDA Bulk

on:
  push:
    branches: [main]
    paths:
      - "MEDCALC_PREGNANCY_GLOBAL_V1.py"
      - "MEDCALC_PREGNANCY_SUPABASE_UPSERTS_V1.py"
      - "MEDCALC_OPENFDA_LABEL_BULK.py"
      - "MEDCALC_PREGNANCY_RESOLUTION_V1.py"
      - "MEDCALC_PREGNANCY_CANDIDATES_V1.py"
      - "tests/test_pregnancy_ingestion_invariants.py"
      - ".github/workflows/medcalc-pregnancy-openfda-bulk.yml"
  workflow_dispatch:
    inputs:
      download_bulk:
        description: "Download all official openFDA drug-label partitions"
        required: true
        default: true
        type: boolean

jobs:
  bulk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache openFDA drug labels
        uses: actions/cache@v4
        with:
          path: .cache/openfda-drug-label
          key: openfda-drug-label-v2
      - name: Download and verify official corpus
        if: ${{ github.event_name == 'push' || inputs.download_bulk }}
        run: python MEDCALC_OPENFDA_LABEL_BULK.py --dir .cache/openfda-drug-label --download
      - name: Run 1,122 MED-ID pregnancy audit from bulk
        env:
          OPENFDA_LABEL_BULK_DIR: .cache/openfda-drug-label
        run: python MEDCALC_PREGNANCY_GLOBAL_V1.py
      - name: Validate complete MED-ID audit
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("generated_pregnancy_global_v1/pregnancy_v1_full_audit.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8-sig")))
          ids=[r.get("med_id","") for r in rows]
          assert len(rows)==1122, f"expected 1122 MED-ID rows, got {len(rows)}"
          assert len(set(ids))==1122, "duplicate MED-ID in pregnancy audit"
          assert all(ids), "empty MED-ID in pregnancy audit"
          summary=json.loads(Path("generated_pregnancy_global_v1/pregnancy_v1_summary.json").read_text())
          assert summary["total"]==1122
          assert summary["regulatory_text_found"]+summary["unresolved"]==1122
          print(summary)
          PY
      - name: Classify regulatory resolution for all MED-ID
        run: python MEDCALC_PREGNANCY_RESOLUTION_V1.py generated_pregnancy_global_v1/pregnancy_v1_full_audit.csv generated_pregnancy_global_v1
      - name: Validate resolution partition for all MED-ID
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          p=Path("generated_pregnancy_global_v1/pregnancy_v1_resolution_status.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8-sig")))
          ids=[r["med_id"] for r in rows]
          allowed={
            "FDA_DAILYMED_LABEL_FOUND",
            "COMBINATION_REQUIRES_EXACT_PRODUCT_IDENTITY",
            "SALT_REQUIRES_VERIFIED_EQUIVALENCE",
            "ESTER_REQUIRES_VERIFIED_EQUIVALENCE",
            "AMBIGUOUS_SALT_ESTER_REQUIRES_PRODUCT_IDENTITY_REVIEW",
            "NO_EXACT_OPENFDA_LABEL_FOUND",
          }
          assert len(rows)==1122
          assert len(set(ids))==1122 and all(ids)
          assert all(r["resolution_status"] in allowed for r in rows)
          counts=Counter(r["resolution_status"] for r in rows)
          assert sum(counts.values())==1122
          summary=json.loads(Path("generated_pregnancy_global_v1/pregnancy_v1_resolution_summary.json").read_text())
          assert sum(summary["resolution_counts"].values())==1122
          assert dict(sorted(counts.items()))==summary["resolution_counts"]
          print(dict(sorted(counts.items())))
          PY
      - name: Validate specialized identity queues
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path("generated_pregnancy_global_v1")
          master=list(csv.DictReader((root/"pregnancy_v1_resolution_status.csv").open(encoding="utf-8-sig")))
          specs={
            "pregnancy_v1_salt_review_queue.csv":"SALT_REQUIRES_VERIFIED_EQUIVALENCE",
            "pregnancy_v1_ester_review_queue.csv":"ESTER_REQUIRES_VERIFIED_EQUIVALENCE",
            "pregnancy_v1_ambiguous_salt_ester_review_queue.csv":"AMBIGUOUS_SALT_ESTER_REQUIRES_PRODUCT_IDENTITY_REVIEW",
            "pregnancy_v1_combination_review_queue.csv":"COMBINATION_REQUIRES_EXACT_PRODUCT_IDENTITY",
          }
          seen=set()
          for filename,status in specs.items():
              rows=list(csv.DictReader((root/filename).open(encoding="utf-8-sig")))
              expected={r["med_id"] for r in master if r["resolution_status"]==status}
              actual={r["med_id"] for r in rows}
              assert len(actual)==len(rows), f"duplicate MED-ID in {filename}"
              assert actual==expected, f"queue mismatch: {filename}"
              assert not (seen & actual), f"cross-queue overlap: {filename}"
              seen |= actual
          summary=json.loads(Path("generated_pregnancy_global_v1/pregnancy_v1_resolution_summary.json").read_text())
          reason_to_status={
              "pregnancy_v1_salt_review_queue.csv":"SALT_REQUIRES_VERIFIED_EQUIVALENCE",
              "pregnancy_v1_ester_review_queue.csv":"ESTER_REQUIRES_VERIFIED_EQUIVALENCE",
              "pregnancy_v1_ambiguous_salt_ester_review_queue.csv":"AMBIGUOUS_SALT_ESTER_REQUIRES_PRODUCT_IDENTITY_REVIEW",
              "pregnancy_v1_combination_review_queue.csv":"COMBINATION_REQUIRES_EXACT_PRODUCT_IDENTITY",
          }
          for filename,status in reason_to_status.items():
              q=list(csv.DictReader((base/filename).open(encoding="utf-8-sig")))
              assert len(q)==summary["resolution_counts"].get(status,0), f"summary mismatch: {filename}"
          print({"specialized_queue_med_ids":len(seen)})
          PY
      - name: Rank review-only regulatory identity candidates
        run: python MEDCALC_PREGNANCY_CANDIDATES_V1.py generated_pregnancy_global_v1/pregnancy_v1_candidate_review_queue.csv generated_pregnancy_global_v1/openfda_pregnancy_generic_name_index.json generated_pregnancy_global_v1/pregnancy_v1_identity_candidates.csv
      - name: Generate review-only Supabase SQL
        run: python MEDCALC_PREGNANCY_SUPABASE_UPSERTS_V1.py
      - uses: actions/upload-artifact@v4
        with:
          name: pregnancy-openfda-bulk-audit
          path: generated_pregnancy_global_v1/
          retention-days: 30
