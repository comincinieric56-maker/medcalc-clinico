name: MEDCALC ECG AVB2 crosslead high-recall audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
    paths:
      - "ecg_avb2_crosslead_highrecall_audit.py"
      - ".github/workflows/medcalc-ecg-avb2-crosslead-highrecall-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb2-crosslead-highrecall-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-highrecall-${{ matrix.fold }}
      - name: Run fold ${{ matrix.fold }}
        run: |
          python ecg_avb2_crosslead_highrecall_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb2-highrecall-${{ matrix.fold }} \
            --output /tmp/AVB2_HIGHRECALL_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-highrecall-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB2_HIGHRECALL_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb2-highrecall-fold-*-${{ github.sha }}
          path: /tmp/avb2-highrecall
          merge-multiple: false
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path("/tmp/avb2-highrecall").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]
          def merge(key):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in (d.get(key) or {}).items()})
              return dict(c)
          out={
            "version":"MEDCALC_AVB2_CROSSLEAD_HIGHRECALL_AUDIT_V1_AGGREGATE",
            "dataset":"PTB-XL","role":"DEVELOPMENT_TUNING_ONLY","folds":[1,2,3,4,5,6,7,8],
            "fast_gate_holdout_excluded":True,"external_validation_claim_allowed":False,
            "selection_avb2_positive_n":sum(int(d.get("selection_avb2_positive_n") or 0) for d in docs),
            "analysis_error_n":sum(int(d.get("analysis_error_n") or 0) for d in docs),
            "analysis_error_types":merge("analysis_error_types"),
            "counts":merge("counts"),"code_counts":merge("code_counts"),
            "policy":"EXACT_EXISTING_HIGH_RECALL_AV_SEQUENCE_THRESHOLDS_AND_MAPPING; AUDIT_ONLY; NO_NEW_THRESHOLDS; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL",
          }
          Path("/tmp/AVB2_HIGHRECALL_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-highrecall-aggregate-${{ github.sha }}
          path: /tmp/AVB2_HIGHRECALL_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
