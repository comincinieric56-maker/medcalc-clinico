name: MEDCALC ECG AVB2 real harmonic specificity audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
    paths:
      - "ecg_avb2_real_harmonic_specificity_audit.py"
      - ".github/workflows/medcalc-ecg-avb2-real-harmonic-specificity-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb2-real-harmonic-specificity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-harmonic-${{ matrix.fold }}
      - name: Run harmonic specificity fold ${{ matrix.fold }}
        run: |
          python ecg_avb2_real_harmonic_specificity_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb2-harmonic-${{ matrix.fold }} \
            --output /tmp/AVB2_HARMONIC_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-harmonic-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB2_HARMONIC_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb2-harmonic-fold-*-${{ github.sha }}
          path: /tmp/avb2-harmonic
          merge-multiple: false
      - name: Aggregate harmonic specificity
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path("/tmp/avb2-harmonic").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]
          groups={}
          for group in ("AVB2","CONTROL"):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in ((d.get("groups") or {}).get(group) or {}).items()})
              groups[group]=dict(c)
          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})
          out={
              "version":"MEDCALC_AVB2_REAL_HARMONIC_SPECIFICITY_AUDIT_V1_AGGREGATE",
              "dataset":"PTB-XL","role":"DEVELOPMENT_TUNING_ONLY","folds":[1,2,3,4,5,6,7,8],
              "fast_gate_holdout_excluded":True,"external_validation_claim_allowed":False,
              "groups":groups,
              "analysis_error_n":sum(errors.values()),
              "analysis_error_types":dict(errors),
              "policy":"EXACT_EXISTING_HARMONIC_RELATION_PLUS_EXISTING_HIGH_RECALL_DROP_MAPPING; AGGREGATE_AUDIT_ONLY; ALL_FIXED_CLEAN_CONTROLS; NO_NEW_THRESHOLDS; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL",
          }
          Path("/tmp/AVB2_HARMONIC_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-harmonic-aggregate-${{ github.sha }}
          path: /tmp/AVB2_HARMONIC_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
