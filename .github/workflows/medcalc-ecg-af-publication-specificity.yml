name: MEDCALC ECG AF publication specificity audit

on:
  push:
    branches:
      - audit/ecg-af-publication-specificity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  af-specificity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_af_publication_specificity_audit.py
      - name: Run AF specificity audit
        run: |
          python ecg_af_publication_specificity_audit.py             --workdir /tmp/medcalc-af-audit             --output /tmp/MEDCALC_AF_AUDIT.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-af-publication-specificity-${{ github.sha }}
          path: /tmp/MEDCALC_AF_AUDIT.json
          if-no-files-found: error
          retention-days: 30
