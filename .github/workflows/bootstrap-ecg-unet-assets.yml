name: Bootstrap ECG U-Net assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-ecg-unet-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pinned Open ECG Digitizer source and weights
        run: |
          set -euxo pipefail
          rm -rf /tmp/open-ecg
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/Ahus-AIM/Open-ECG-Digitizer.git /tmp/open-ecg
          cd /tmp/open-ecg
          git checkout 97a15087d4abcda843da8c58ee74b1d8f47e6f9a
          git lfs pull --include="weights/unet_weights_07072025.pt,weights/lead_name_unet_weights_07072025.pt"

          echo "17fe7071ef270102631306127262fc08c250d79d4e3aeb572ab1719dd34d320b  weights/unet_weights_07072025.pt" | sha256sum -c -
          echo "840bd6bf2433ee6c22db67f57c861d9d427f29e10a32eeb334f0bcf061b175a2  weights/lead_name_unet_weights_07072025.pt" | sha256sum -c -

      - name: Vendor verified source, weights and license
        run: |
          set -euxo pipefail
          rm -rf ecg_digitizer_vendor
          mkdir -p ecg_digitizer_vendor
          cp -R /tmp/open-ecg/src ecg_digitizer_vendor/src

          # Inference imports src.utils, whose upstream training helpers import Ray.
          # Ray is not needed for inference. Make that one optional so MEDCALC
          # does not install a large training-only dependency.
          python - <<'PY'
          from pathlib import Path

          # Training-only Ray dependency is not needed for inference.
          p = Path("ecg_digitizer_vendor/src/utils.py")
          s = p.read_text(encoding="utf-8")
          old = "from ray.tune import Stopper\n"
          new = (
              "try:\n"
              "    from ray.tune import Stopper\n"
              "except Exception:\n"
              "    class Stopper:\n"
              "        pass\n"
          )
          if old not in s:
              raise SystemExit("Expected Ray import not found in vendored src/utils.py")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # MEDCALC keeps experimental dewarping disabled. Avoid importing the
          # unused TPS stack in the live inference path.
          p = Path("ecg_digitizer_vendor/src/model/inference_wrapper.py")
          s = p.read_text(encoding="utf-8")
          old = (
              "    def _load_dewarper(self) -> Any:\n"
              "        dewarper_class = import_class_from_path(self.config.DEWARPER.class_path)\n"
              "        dewarper: Any = dewarper_class(**self.config.DEWARPER.KWARGS)\n"
              "        return dewarper\n"
          )
          new = (
              "    def _load_dewarper(self) -> Any:\n"
              "        # MEDCALC inference keeps dewarping disabled.\n"
              "        if not self.apply_dewarping:\n"
              "            return None\n"
              "        dewarper_class = import_class_from_path(self.config.DEWARPER.class_path)\n"
              "        dewarper: Any = dewarper_class(**self.config.DEWARPER.KWARGS)\n"
              "        return dewarper\n"
          )
          if old not in s:
              raise SystemExit("Expected dewarper block not found in vendored inference_wrapper.py")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

          mkdir -p ecg_digitizer_assets
          cp /tmp/open-ecg/weights/unet_weights_07072025.pt ecg_digitizer_assets/
          cp /tmp/open-ecg/weights/lead_name_unet_weights_07072025.pt ecg_digitizer_assets/
          cp /tmp/open-ecg/LICENSE ecg_digitizer_assets/LICENSE_OPEN_ECG_DIGITIZER.txt

          cat > ecg_digitizer_assets/PROVENANCE.json <<'JSON'
          {
            "source_repository": "https://github.com/Ahus-AIM/Open-ECG-Digitizer",
            "source_commit": "97a15087d4abcda843da8c58ee74b1d8f47e6f9a",
            "license": "CC BY-SA 4.0",
            "weights": {
              "unet_weights_07072025.pt": {
                "sha256": "17fe7071ef270102631306127262fc08c250d79d4e3aeb572ab1719dd34d320b",
                "size_bytes": 90464067
              },
              "lead_name_unet_weights_07072025.pt": {
                "sha256": "840bd6bf2433ee6c22db67f57c861d9d427f29e10a32eeb334f0bcf061b175a2",
                "size_bytes": 23296757
              }
            },
            "source_patch": "src/utils.py: Ray training dependency made optional; inference behavior unchanged"
          }
          JSON

      - name: Commit vendored digitizer to MEDCALC
        run: |
          set -euxo pipefail
          git config user.name "MEDCALC ECG Assets"
          git config user.email "medcalc-ecg-assets@users.noreply.github.com"
          git add ecg_digitizer_assets ecg_digitizer_vendor
          if git diff --cached --quiet; then
            echo "Digitizer source/assets already present."
            exit 0
          fi
          git commit -m "Vendor pinned Open ECG Digitizer source and weights"
          git push origin HEAD:main
