name: EKG V52 research-only contract checks
on:
  push:
    branches: [feature/ekg-unificado-v52-investigacion]
    paths:
      - "ekg_unificado_v52/**"
      - ".github/workflows/ekg-v52-research-ci.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check "numpy>=2.0,<3"
      - name: Verify Python syntax
        run: python -m py_compile ekg_unificado_v52/medcalc_ekg_unificado_v52.py ekg_unificado_v52/test_v52.py
      - name: Synthetic research safety and interval contract tests
        run: python ekg_unificado_v52/test_v52.py
