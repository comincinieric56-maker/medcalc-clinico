name: MEDCALC ECG ZZU recovery retired

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_dataset_provenance.json"
      - "ecg_external_validation_results/ZZU_PECG_PEDIATRIC_DIAGNOSTIC_V1.json"
      - ".github/workflows/medcalc-ecg-zzu-score-recovery.yml"

permissions:
  contents: read

jobs:
  historical-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify ZZU consumed baseline guard
        run: |
          python ecg_validation_guard.py --consumed zzu_pecg

      - name: Verify scorer recovery is retired
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/medcalc-ecg-zzu-score-recovery.yml").read_text()
          assert "workflow_dispatch:" not in text
          assert "\n  push:" not in text
          assert "actions/download-artifact" not in text
          assert "ecg_external_zzu_score.py" not in text
          print("MEDCALC_ZZU_SCORING_RECOVERY_RETIRED")
          PY
