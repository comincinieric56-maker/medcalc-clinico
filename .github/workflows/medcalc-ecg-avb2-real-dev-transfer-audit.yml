name: MEDCALC ECG AVB2 real-development transfer audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  folds-1-8:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore shared PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-dev-folds1-8
      - name: Run folds 1-8 only
        run: |
          python ecg_adult_diagnostic_dev_benchmark.py \
            --folds 1,2,3,4,5,6,7,8 \
            --workdir /tmp/medcalc-avb2-dev-folds1-8 \
            --output /tmp/MEDCALC_AVB2_REAL_DEV_TRANSFER.json
      - name: Assert development-only provenance and print AV transfer summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/MEDCALC_AVB2_REAL_DEV_TRANSFER.json").read_text())
          assert d["dataset"]=="PTB-XL", d
          assert d["role"]=="DEVELOPMENT_TUNING_ONLY", d
          assert d["fold_policy"]["executed_folds"]==[1,2,3,4,5,6,7,8], d
          assert 9 not in d["fold_policy"]["executed_folds"], d
          assert 10 not in d["fold_policy"]["executed_folds"], d
          assert d["external_validation_claim_allowed"] is False, d
          assert d["constraints"]["consumed_external_datasets_used_for_tuning"] is False, d
          out={
            "records_analyzed":d["records_analyzed"],
            "analysis_error_n":d["analysis_error_n"],
            "AVB1":d["metrics"]["AVB1"],
            "AVB2":d["metrics"]["AVB2"],
            "AVB3":d["metrics"]["AVB3"],
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: avb2-real-dev-transfer-folds1-8-${{ github.sha }}
          path: /tmp/MEDCALC_AVB2_REAL_DEV_TRANSFER.json
          if-no-files-found: error
          retention-days: 30
