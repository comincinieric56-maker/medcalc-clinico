name: MEDCALC ECG MIMIC-IV historical baseline integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_dataset_provenance.json"
      - "ecg_external_validation_results/MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json"
      - "ecg_external_validation_contracts/MIMIC_IV_ECG_MEASUREMENT_V1.json"
      - "ecg_validation_guard.py"
      - ".github/workflows/medcalc-ecg-mimic-external.yml"
  push:
    branches: [main]
    paths:
      - "ecg_dataset_provenance.json"
      - "ecg_external_validation_results/MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json"
      - "ecg_external_validation_contracts/MIMIC_IV_ECG_MEASUREMENT_V1.json"
      - "ecg_validation_guard.py"
      - ".github/workflows/medcalc-ecg-mimic-external.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumed-baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify MIMIC is permanently consumed
        run: |
          python ecg_validation_guard.py --consumed mimic_iv_ecg

      - name: Verify frozen aggregate baseline evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "ecg_external_validation_results/"
              "MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json"
          )
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["validation_id"] == "MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1", d
          assert d["clinical_engine_baseline_sha"] == (
              "7b03f1ada34c93246ec9b72fa63284269d2564ab"
          ), d
          assert d["records_scored"] == 5000, d
          assert d["patients_scored"] == 5000, d
          assert d["analysis_failure_rate"] == 0.0, d
          assert d["clinical_validation_claim_allowed"] is False, d
          assert d["external_measurement_validation_claim_allowed"] is True, d
          assert d["anti_leakage"]["threshold_tuning_allowed"] is False, d
          assert d["anti_leakage"]["individual_record_debugging_allowed"] is False, d
          assert d["anti_leakage"]["row_level_joined_output_persisted"] is False, d
          assert d["workflow_evidence"]["workflow_run_id"] == 36449822514, d
          assert d["workflow_evidence"]["aggregate_artifact_id"] == 10986209363, d
          assert d["workflow_evidence"]["aggregate_artifact_digest"] == (
              "sha256:29b43afeb8e51911a6008a65e42a7350d50386920d2efc91b87a14876d0e5a27"
          ), d

          print("MEDCALC_MIMIC_CONSUMED_BASELINE_INTEGRITY_PASS")
          PY

      - name: Prohibit re-execution as external validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("ecg_dataset_provenance.json").read_text())
          provisional = {x["id"] for x in d.get("provisional_external_locked", [])}
          consumed = {
              x["id"]: x for x in d.get("external_baseline_consumed", [])
          }
          assert "mimic_iv_ecg" not in provisional, provisional
          row = consumed["mimic_iv_ecg"]
          assert row["status"] == "EXTERNAL_BASELINE_CONSUMED", row
          assert row["external_validation_allowed"] is False, row
          assert row["allow_tuning"] is False, row
          assert row["allow_threshold_selection"] is False, row
          assert row["allow_debugging_on_individual_test_labels"] is False, row
          print("MEDCALC_MIMIC_REEXECUTION_PROHIBITED_PASS")
          PY
