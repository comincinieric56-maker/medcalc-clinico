name: MEDCALC ECG MIMIC-IV frozen external measurement validation

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_external_mimic_prepare.py"
      - "ecg_external_mimic_shard.py"
      - "ecg_external_mimic_score.py"
      - "ecg_external_mimic_selftest.py"
      - "ecg_external_validation_contracts/MIMIC_IV_ECG_MEASUREMENT_V1.json"
      - "ecg_dataset_provenance.json"
      - ".github/workflows/medcalc-ecg-mimic-external.yml"
  push:
    branches: [main]
    paths:
      - "ecg_external_mimic_prepare.py"
      - "ecg_external_mimic_shard.py"
      - "ecg_external_mimic_score.py"
      - "ecg_external_mimic_selftest.py"
      - "ecg_external_validation_contracts/MIMIC_IV_ECG_MEASUREMENT_V1.json"
      - "ecg_dataset_provenance.json"
      - ".github/workflows/medcalc-ecg-mimic-external.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify MIMIC remains eligible and frozen
        run: |
          python ecg_validation_guard.py --external mimic_iv_ecg

      - name: Run synthetic anti-leakage harness self-test
        run: |
          python ecg_external_mimic_selftest.py

      - name: Verify validation contract is prespecified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ecg_external_validation_contracts/MIMIC_IV_ECG_MEASUREMENT_V1.json")
          d=json.loads(p.read_text())
          assert d["clinical_engine_baseline_sha"] == "7b03f1ada34c93246ec9b72fa63284269d2564ab", d
          assert d["cohort"]["patient_n"] == 5000, d
          assert d["cohort"]["records_per_patient"] == 1, d
          assert d["anti_leakage"]["machine_measurements_opened_only_after_all_shards_complete"] is True, d
          assert d["anti_leakage"]["threshold_tuning_allowed"] is False, d
          print("MEDCALC_MIMIC_EXTERNAL_CONTRACT_PASS")
          PY

  prepare:
    if: github.event_name != 'pull_request'
    needs: harness-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Download public MIMIC-IV-ECG record index only
        run: |
          mkdir -p /tmp/mimic-external
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://physionet.org/files/mimic-iv-ecg/1.0/record_list.csv" \
            -o /tmp/mimic-external/record_list.csv

      - name: Freeze label-blind patient-level selection
        run: |
          python ecg_external_mimic_prepare.py \
            --record-list /tmp/mimic-external/record_list.csv \
            --output-dir /tmp/mimic-external/prepared \
            --patient-n 5000 \
            --shards 10

      - name: Assert selection did not use comparator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/mimic-external/prepared/mimic_selection_summary.json").read_text())
          assert d["record_n"] == 5000, d
          assert d["selection_is_label_blind"] is True, d
          assert d["selection_uses_machine_measurements"] is False, d
          assert d["selection_uses_reports"] is False, d
          print("MEDCALC_MIMIC_SELECTION_FROZEN_PASS")
          PY

      - name: Upload frozen selection manifests
        uses: actions/upload-artifact@v4
        with:
          name: mimic-external-frozen-selection
          path: /tmp/mimic-external/prepared
          if-no-files-found: error
          retention-days: 30

  inference:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ["00","01","02","03","04","05","06","07","08","09"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download frozen selection
        uses: actions/download-artifact@v4
        with:
          name: mimic-external-frozen-selection
          path: /tmp/mimic-external/prepared

      - name: Run comparator-blind inference shard
        run: |
          mkdir -p /tmp/mimic-external/predictions
          python ecg_external_mimic_shard.py \
            --manifest "/tmp/mimic-external/prepared/manifests/mimic-shard-${{ matrix.shard }}.csv" \
            --output "/tmp/mimic-external/predictions/mimic-pred-${{ matrix.shard }}.csv"

      - name: Assert no comparator material exists in inference workspace
        run: |
          test ! -e /tmp/mimic-external/machine_measurements.csv
          test ! -e /tmp/mimic-external/waveform_note_links.csv
          echo "MEDCALC_MIMIC_INFERENCE_LABEL_ISOLATION_PASS"

      - name: Transfer prediction shard to scoring job
        uses: actions/upload-artifact@v4
        with:
          name: mimic-external-pred-${{ matrix.shard }}
          path: /tmp/mimic-external/predictions/mimic-pred-${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 1

  score:
    if: github.event_name != 'pull_request'
    needs: [prepare, inference]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Download frozen selection
        uses: actions/download-artifact@v4
        with:
          name: mimic-external-frozen-selection
          path: /tmp/mimic-external/prepared

      - name: Download all completed inference shards
        uses: actions/download-artifact@v4
        with:
          pattern: mimic-external-pred-*
          path: /tmp/mimic-external/predictions
          merge-multiple: true

      - name: Open machine comparator only after all inference completed
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://physionet.org/files/mimic-iv-ecg/1.0/machine_measurements.csv" \
            -o /tmp/mimic-external/machine_measurements.csv

      - name: Score aggregate measurement agreement
        run: |
          python ecg_external_mimic_score.py \
            --predictions-dir /tmp/mimic-external/predictions \
            --machine-measurements /tmp/mimic-external/machine_measurements.csv \
            --selection-summary /tmp/mimic-external/prepared/mimic_selection_summary.json \
            --output /tmp/mimic-external/MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json

      - name: Assert external scoring contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/mimic-external/MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json")
          d=json.loads(p.read_text())
          assert d["validation_id"] == "MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1", d
          assert d["records_scored"] == 5000, d
          assert d["patients_scored"] == 5000, d
          assert d["anti_leakage"]["machine_measurements_loaded_after_all_inference"] is True, d
          assert d["anti_leakage"]["individual_record_debugging_allowed"] is False, d
          assert d["anti_leakage"]["row_level_joined_output_persisted"] is False, d
          assert d["clinical_validation_claim_allowed"] is False, d
          print("MEDCALC_MIMIC_EXTERNAL_SCORING_PASS")
          for metric, row in d["metrics"].items():
              print(metric, json.dumps(row, sort_keys=True))
          PY

      - name: Upload aggregate external validation only
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-mimic-iv-ecg-frozen-measurement-v1-${{ github.sha }}
          path: /tmp/mimic-external/MIMIC_IV_ECG_FROZEN_MEASUREMENT_V1.json
          if-no-files-found: error
          retention-days: 90
