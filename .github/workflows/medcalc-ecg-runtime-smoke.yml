name: MEDCALC ECG runtime dependency smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "ecg_unet_r27_bridge.py"
      - "ecg_r27_research_page.py"
      - "ecg_unet_worker.py"
      - "ecg_structured_report.py"
      - "ecg_machine_header.py"
      - "ecg_report_pdf.py"
      - "ecg_layout_detector.py"
      - "packages.txt"
      - "r27_local_runtime.py"
      - "ecg_digitizer_vendor/**"
      - "ecg_digitizer_assets/PROVENANCE.json"
      - ".github/workflows/medcalc-ecg-runtime-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "ecg_unet_r27_bridge.py"
      - "ecg_r27_research_page.py"
      - "ecg_unet_worker.py"
      - "ecg_structured_report.py"
      - "ecg_report_pdf.py"
      - "ecg_layout_detector.py"
      - ".github/workflows/medcalc-ecg-runtime-smoke.yml"

jobs:
  runtime-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify scientific runtime imports
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import pandas
          import sklearn
          import skimage
          import yaml
          import yacs
          import wfdb
          import neurokit2
          import cv2
          import fitz
          import reportlab

          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("numpy", numpy.__version__)
          print("scipy", scipy.__version__)
          print("wfdb", wfdb.__version__)
          print("neurokit2", neurokit2.__version__)
          assert not torch.cuda.is_available()
          PY

      - name: Verify vendored digitizer imports and checkpoint identities
        run: |
          python - <<'PY'
          import gc
          import sys
          from pathlib import Path
          import torch

          from ecg_unet_r27_bridge import verify_digitiser_assets
          status = verify_digitiser_assets()
          print(status)

          vendor = Path("ecg_digitizer_vendor").resolve()
          sys.path.insert(0, str(vendor))

          from src.model.inference_wrapper import InferenceWrapper
          from src.model.unet import UNet

          seg = UNet(
              num_in_channels=3,
              num_out_channels=4,
              dims=[32, 64, 128, 256, 320, 320, 320, 320],
              depth=2,
          )
          state = torch.load(
              "ecg_digitizer_assets/unet_weights_07072025.pt",
              map_location="cpu",
              weights_only=True,
          )
          state = {k.replace("_orig_mod.", ""): v for k, v in state.items()}
          seg.load_state_dict(state, strict=True)
          print("SEGMENTATION_UNET_STRICT_LOAD_PASS")
          del seg, state
          gc.collect()

          lead = UNet(
              num_in_channels=1,
              num_out_channels=13,
              dims=[32, 64, 128, 256, 256],
              depth=2,
          )
          state = torch.load(
              "ecg_digitizer_assets/lead_name_unet_weights_07072025.pt",
              map_location="cpu",
              weights_only=True,
          )
          state = {k.replace("_orig_mod.", ""): v for k, v in state.items()}
          lead.load_state_dict(state, strict=True)
          print("LEAD_ID_UNET_STRICT_LOAD_PASS")
          PY

      - name: Verify geometry-first ECG layout router
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image
          from pathlib import Path

          from ecg_layout_detector import (
              _interpolate_preserving_nan,
              canonicalize_extracted_rows,
              detect_ecg_layout,
          )

          def make_page(path, row_centers):
              w, h = 1200, 800
              img = np.full((h, w, 3), 255, dtype=np.uint8)
              for x in range(0, w, 20):
                  img[:, x] = [255, 220, 220]
              for y in range(0, h, 20):
                  img[y, :] = [255, 220, 220]
              xx = np.arange(w)
              for center in row_centers:
                  yy = np.clip(
                      np.rint(center + 18 * np.sin(xx / 24.0)).astype(int),
                      0,
                      h - 1,
                  )
                  img[yy, xx] = 0
              Image.fromarray(img).save(path)

          p6 = Path("/tmp/layout_6x2.png")
          p3 = Path("/tmp/layout_3x4.png")
          make_page(p6, [150, 245, 340, 435, 530, 625, 730])
          make_page(p3, [190, 370, 550, 730])

          r6 = detect_ecg_layout(p6)
          r3 = detect_ecg_layout(p3)

          print("6x2", r6)
          print("3x4", r3)

          assert r6["layout"] == "6x2"
          assert r6["rhythm_strip"] is True
          assert r6["route"] == "6X2_ACTIVE_SPAN_CANONICALIZER"
          assert r6["leads_detected"] == 12
          assert r6["confidence"] >= 0.85

          assert r3["layout"] == "3x4"
          assert r3["rhythm_strip"] is True
          assert r3["route"] == "STANDARD_3X4_DIGITIZER"
          assert r3["leads_detected"] == 12
          assert r3["confidence"] >= 0.85

          raw = np.vstack([
              np.sin(np.linspace(0, 30, 1000)) + row * 30
              for row in range(7)
          ])
          canonical, meta = canonicalize_extracted_rows(
              raw,
              avg_pixel_per_mm=4.0,
              layout="6x2",
              rhythm_strip=True,
              target_num_samples=5000,
          )
          assert canonical.shape == (12, 5000)
          cov = meta["coverage_by_lead"]
          assert abs(cov["II"] - 1.0) < 1e-9
          for lead in ["I","III","aVR","aVL","aVF","V1","V2","V3","V4","V5","V6"]:
              assert 0.49 <= cov[lead] <= 0.51, (lead, cov[lead])

          # Regression: resampling must never bridge an unobserved
          # interval with a synthetic straight line.
          row = np.asarray([0.0, 1.0, 2.0, np.nan, np.nan, 8.0, 9.0, 10.0])
          up = _interpolate_preserving_nan(row, 80)
          assert np.isfinite(up[:25]).any()
          assert np.isfinite(up[-25:]).any()
          assert np.isnan(up[31:49]).all(), up[31:49]
          print("MEDCALC_ECG_NAN_GAP_PRESERVATION_PASS")

          print("MEDCALC_LAYOUT_ROUTER_SYNTHETIC_PASS")
          PY

      - name: Initialize the actual MEDCALC U-Net inference stack
        run: |
          python - <<'PY'
          from pathlib import Path
          from ecg_unet_worker import _load_digitizer

          model = _load_digitizer(
              Path("ecg_digitizer_vendor").resolve(),
              Path("ecg_digitizer_assets/unet_weights_07072025.pt").resolve(),
              Path("ecg_digitizer_assets/lead_name_unet_weights_07072025.pt").resolve(),
              resample_size=1200,
          )
          assert int(model.resample_size) == 1200
          assert int(model.segmentation_tile_size) == 896
          assert int(model.segmentation_tile_overlap) == 192
          assert int(model.segmentation_tiling_threshold) == 1400
          print(type(model).__name__)
          print("MEDCALC_ECG_UNET_INITIALIZATION_PASS")

          # Regression: overlap tiling must reproduce a pixelwise segmentation
          # result without seams while limiting inference to small tiles.
          import gc
          import torch

          class PixelwiseSegmentation(torch.nn.Module):
              def forward(self, x):
                  base = x[:, :1]
                  zeros = torch.zeros_like(base)
                  return torch.cat(
                      [0.5 * base, -0.5 * base, 1.25 * base, zeros],
                      dim=1,
                  )

          if hasattr(model, "segmentation_model"):
              del model.segmentation_model
          gc.collect()
          model.segmentation_model = PixelwiseSegmentation()
          model.segmentation_tile_size = 256
          model.segmentation_tile_overlap = 64
          image = torch.linspace(
              0.0, 1.0, 3 * 384 * 640, dtype=torch.float32
          ).reshape(1, 3, 384, 640)

          model.segmentation_tiling_threshold = 400
          tiled_signal, tiled_grid, tiled_text = model._get_feature_maps(
              image.clone(), need_text=False
          )
          assert tiled_text.numel() == 0

          model.segmentation_tiling_threshold = 10_000
          full_signal, full_grid, full_text = model._get_feature_maps(
              image.clone(), need_text=False
          )
          assert full_text.numel() == 0
          assert torch.allclose(tiled_signal, full_signal, atol=1e-5, rtol=1e-5)
          assert torch.allclose(tiled_grid, full_grid, atol=1e-5, rtol=1e-5)
          print("MEDCALC_ECG_TILED_SEGMENTATION_STITCH_PASS")
          PY

      - name: Run real photo through U-Net worker
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/Ahus-AIM/Open-ECG-Digitizer/97a15087d4abcda843da8c58ee74b1d8f47e6f9a/test/test_data/data/ecg_data/10_1.png"             -o /tmp/medcalc_ecg_test.png

          python ecg_unet_worker.py             --vendor-root "$(pwd)/ecg_digitizer_vendor"             --segmentation-model "$(pwd)/ecg_digitizer_assets/unet_weights_07072025.pt"             --lead-model "$(pwd)/ecg_digitizer_assets/lead_name_unet_weights_07072025.pt"             --source /tmp/medcalc_ecg_test.png             --output-root /tmp/medcalc_ecg_out             --meta /tmp/medcalc_ecg_meta.json             --pdf-page-index 0

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/medcalc_ecg_meta.json")
          meta = json.loads(p.read_text())
          print(json.dumps(meta, indent=2))
          assert meta["status"] in {"DIGITIZED_ONLY", "PASS"}
          assert meta["signal"]["shape_500_candidate"] == [5000, 12]
          assert len(meta["signal"]["sig_names"]) == 12

          report = meta.get("structured_report") or {}
          report_text = str((report.get("formatted") or {}).get("text") or "")
          for required in [
              "RITMO:",
              "FC:",
              "EJE:",
              "SEGMENTO PR:",
              "COMPLEJO QRS:",
              "SEGMENTO ST:",
              "ONDA T:",
              "CONCLUSIÓN:",
              "IDX:",
          ]:
              assert required in report_text, required
          print(report_text)
          print("MEDCALC_ECG_STRUCTURED_REPORT_PASS")
          print("MEDCALC_ECG_REAL_PHOTO_UNET_PASS")
          PY

      - name: Verify remote ECG backend client contract
        run: |
          python - <<'PY'
          import json
          import ecg_unet_r27_bridge as bridge

          class DummyResponse:
              status_code = 200
              text = ""
              def json(self):
                  return {
                      "digitizer": {
                          "status": "PASS_TILED",
                          "signal": {
                              "r27_tiled": True,
                              "r27_input_mode": "R27_SYNTHETIC_10S_FROM_OBSERVED_SEGMENT_REPEAT",
                              "layout_name": "6x2+1R",
                              "rhythm_strip_observed": True,
                              "rhythm_strip_lead": "II",
                          },
                      },
                      "payload": {
                          "modules": {
                              "AF": {"probability": 0.7},
                              "LBBB": {"probability": 0.2},
                          }
                      },
                      "r27_error": None,
                  }

          seen = {}
          def fake_post(url, headers, files, data, timeout):
              seen["url"] = url
              seen["headers"] = headers
              seen["files"] = files
              seen["data"] = data
              seen["timeout"] = timeout
              return DummyResponse()

          original = bridge.requests.post
          bridge.requests.post = fake_post
          try:
              result = bridge.digitize_photo_pdf_remote(
                  "https://example.invalid",
                  "token123",
                  source_name="ecg.pdf",
                  source_bytes=b"%PDF-test",
                  age=50,
                  sex="0",
                  pdf_page_index=0,
              )
          finally:
              bridge.requests.post = original

          assert seen["url"].endswith("/v1/ecg/analyze")
          assert seen["headers"]["Authorization"] == "Bearer token123"
          assert result["remote_backend"] is True
          assert result["digitizer"]["streamlit_loaded_unet"] is False
          assert result["payload"]["modules"]["AF"]["interpretability"] == "NOT_INTERPRETABLE_R27_TILED"
          print("MEDCALC_REMOTE_ECG_CLIENT_PASS")
          PY

      - name: Verify GitHub Actions ECG client
        run: |
          python - <<'PY'
          import io, json, zipfile
          import ecg_unet_r27_bridge as bridge

          payload = {
              "digitizer": {
                  "status": "PASS_TILED",
                  "signal": {"r27_tiled": True},
              },
              "payload": {"modules": {"AF": {"probability": 0.7}}},
          }
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w") as zf:
              zf.writestr("result.json", json.dumps(payload))
          artifact_bytes = buf.getvalue()

          class R:
              def __init__(self, code=200, obj=None, content=b""):
                  self.status_code = code
                  self._obj = obj
                  self.content = content
                  self.text = ""
              def json(self):
                  return self._obj

          calls = []
          def post(url, **kwargs):
              calls.append(url)
              if url.endswith("/v1/ecg/jobs/source"):
                  return R(200, {
                      "job_id": "abc123",
                      "source_url": "https://stage.invalid/source",
                  })
              if url.endswith("/dispatches"):
                  return R(204, None)
              raise AssertionError(url)

          def get(url, **kwargs):
              if url.endswith("/actions/artifacts"):
                  return R(200, {"artifacts": [{
                      "name": "medcalc-ecg-abc123",
                      "expired": False,
                      "created_at": "2026-09-26T00:00:00Z",
                      "archive_download_url": "https://api.github.com/a.zip",
                  }]})
              if url.endswith("/a.zip"):
                  return R(200, None, artifact_bytes)
              raise AssertionError(url)

          old_post, old_get = bridge.requests.post, bridge.requests.get
          bridge.requests.post, bridge.requests.get = post, get
          try:
              result = bridge.digitize_photo_pdf_github_actions(
                  "https://stage.invalid", None, "x",
                  source_name="ecg.pdf",
                  source_bytes=b"%PDF",
                  age=50,
                  sex="0",
                  timeout_seconds=20,
                  poll_seconds=3,
              )
          finally:
              bridge.requests.post, bridge.requests.get = old_post, old_get

          assert result["remote_compute"] == "GITHUB_ACTIONS"
          assert result["digitizer"]["streamlit_loaded_unet"] is False
          assert result["payload"]["modules"]["AF"]["interpretability"] == "NOT_INTERPRETABLE_R27_TILED"
          print("MEDCALC_GITHUB_ACTIONS_ECG_CLIENT_PASS")
          PY

      - name: Verify MEDCALC ECG modules import
        run: |
          python - <<'PY'
          import r27_local_runtime
          import ecg_unet_r27_bridge
          import ecg_unet_worker
          import ecg_structured_report
          import ecg_machine_header
          import ecg_layout_detector
          import ecg_report_pdf
          import ecg_signal_reconstruction
          import ecg_signal_measurements
          import ecg_signal_report_adapter
          import numpy as np
          print("MEDCALC_ECG_RUNTIME_IMPORT_PASS")

          # Architecture V2: U-Net centerlines are converted with independent
          # horizontal/vertical grid calibration into a layout-independent
          # per-lead signal contract. Layout only assigns ROIs.
          def synthetic_rows(layout):
              mm_per_px = 0.20
              speed = 25.0
              width = int(round(10.0 * speed / mm_per_px))
              matrix = ecg_signal_reconstruction.LAYOUTS[layout]
              rows = np.zeros((len(matrix), width), dtype=np.float64)
              x = np.arange(width, dtype=float)
              for r in range(len(matrix)):
                  baseline = 100.0 + 35.0 * r
                  rows[r] = baseline - 5.0 * np.sin(2*np.pi*x/100.0)
              return rows

          expected_duration = {"3x4": 2.5, "6x2": 5.0, "12x1": 10.0}
          for layout in ("3x4", "6x2", "12x1"):
              rows = synthetic_rows(layout)
              canonical = ecg_signal_reconstruction.reconstruct_canonical_ecg(
                  rows,
                  layout=layout,
                  rhythm_strip=False,
                  active_x=[0, rows.shape[1]-1],
                  pixel_spacing_mm={"x": 0.20, "y": 0.20},
                  speed_mm_per_s=25.0,
                  gain_mm_per_mv=10.0,
                  fs=500,
                  layout_confidence=0.98,
                  row_sources=["OPEN_ECG_SIGNAL_EXTRACTOR"] * rows.shape[0],
              )
              assert canonical["fs"] == 500
              assert canonical["contract"].startswith("PER_LEAD_SIGNAL_MV")
              for lead in ecg_signal_reconstruction.LEADS:
                  item = canonical["leads"][lead]
                  assert abs(float(item["duration_s"]) - expected_duration[layout]) < 0.02, (layout, lead, item["duration_s"])
                  sig = np.asarray([np.nan if v is None else v for v in item["signal_mv"]], dtype=float)
                  assert np.nanmax(sig) - np.nanmin(sig) > 0.15
                  assert item["confidence"] > 0.80
              # Layout disappears from the clinical signal contract: every
              # route exposes the same lead keys, units and fixed sample rate.
              assert set(canonical["leads"]) == set(ecg_signal_reconstruction.LEADS)
          print("MEDCALC_CALIBRATED_SIGNAL_LAYOUT_INDEPENDENCE_PASS")

          # Calibration assumptions are explicit and confidence-reducing.
          assumed = ecg_signal_reconstruction.resolve_calibration(
              {"x": 0.20, "y": 0.20},
              speed_mm_per_s=None,
              gain_mm_per_mv=None,
          )
          assert assumed["speed_mm_per_s"] == 25.0
          assert assumed["gain_mm_per_mv"] == 10.0
          assert assumed["speed_assumed"] and assumed["gain_assumed"]
          assert assumed["confidence"] <= 0.55
          print("MEDCALC_CALIBRATION_PROVENANCE_PASS")

          # Regression: R27-TILED must preserve true 10 s leads and repeat
          # only exact observed samples on incomplete leads.
          tiled_src = np.full((5000, 12), np.nan, dtype=np.float64)
          base = np.sin(np.linspace(0, 20 * np.pi, 2500, endpoint=False))
          for j in range(12):
              if j == 1:
                  tiled_src[:, j] = np.sin(np.linspace(0, 40 * np.pi, 5000, endpoint=False))
              else:
                  tiled_src[1200:3700, j] = base + j

          tiled_out, tiled_meta = ecg_unet_worker._build_r27_tiled_signal(
              tiled_src,
              fs=500,
              target_samples=5000,
              min_real_seconds=1.5,
          )
          assert tiled_out.shape == (5000, 12)
          assert np.isfinite(tiled_out).all()
          assert np.allclose(tiled_out[:, 1], tiled_src[:, 1])
          assert tiled_meta["lead_provenance"]["II"]["mode"] == "REAL_10S"
          assert tiled_meta["lead_provenance"]["I"]["source_seconds"] == 5.0
          assert np.allclose(tiled_out[:2500, 0], tiled_src[1200:3700, 0])
          assert np.allclose(tiled_out[2500:, 0], tiled_src[1200:3700, 0])
          print("MEDCALC_R27_TILED_ADAPTER_PASS")

          # Regression: failure of the research-only R27-TILED coverage gate
          # must not discard a successful U-Net digitization or structured
          # report. It is downgraded to DIGITIZED_ONLY instead.
          short_src = np.full((5000, 12), np.nan, dtype=np.float64)
          for j in range(12):
              short_src[500:1500, j] = np.sin(
                  np.linspace(0, 6 * np.pi, 1000, endpoint=False)
              ) + j
          short_src[:, 8] = np.nan
          short_src[800:1375, 8] = np.sin(
              np.linspace(0, 4 * np.pi, 575, endpoint=False)
          )
          rejected_reason = None
          try:
              ecg_unet_worker._build_r27_tiled_signal(
                  short_src,
                  fs=500,
                  target_samples=5000,
                  min_real_seconds=1.5,
              )
          except RuntimeError as exc:
              rejected_reason = str(exc)
          assert rejected_reason is not None
          assert "V3" in rejected_reason
          assert "1.15 s" in rejected_reason

          preserved_meta = {
              "signal": {},
              "structured_report": {
                  "formatted": {"text": "RITMO: IRREGULAR"}
              },
          }
          ecg_unet_worker._mark_r27_tiled_unavailable(
              preserved_meta,
              rejected_reason,
          )
          assert preserved_meta["status"] == "DIGITIZED_ONLY"
          assert preserved_meta["signal"]["r27_input_compatible"] is False
          assert preserved_meta["signal"]["r27_tiled"] is False
          assert "structured_report" in preserved_meta
          assert preserved_meta["structured_report"]["formatted"]["text"] == "RITMO: IRREGULAR"
          print("MEDCALC_R27_TILED_GRACEFUL_DOWNGRADE_PASS")

          # Regression: if the 2000 px primary route fragments one lead below
          # the 1.50 s R27-TILED gate, retry the complete 1200 px reference
          # signal. Never splice individual leads across routes.
          reference_src = np.full((5000, 12), np.nan, dtype=np.float64)
          ref_wave = np.sin(np.linspace(0, 8 * np.pi, 1000, endpoint=False))
          for j in range(12):
              reference_src[900:1900, j] = ref_wave + j

          (
              ref_tiled,
              ref_meta,
              ref_source,
              primary_rejection,
          ) = ecg_unet_worker._build_r27_tiled_with_reference(
              short_src,
              reference_signal_uv=reference_src,
              fs=500,
              target_samples=5000,
              min_real_seconds=1.5,
          )
          assert ref_tiled.shape == (5000, 12)
          assert np.isfinite(ref_tiled).all()
          assert ref_source == "LOW_MEMORY_1200_FORCED_6X2_REFERENCE_FALLBACK"
          assert "V3" in primary_rejection
          assert ref_meta["lead_provenance"]["V3"]["source_seconds"] == 2.0
          print("MEDCALC_R27_TILED_REFERENCE_FALLBACK_PASS")

          # Regression: morphology and temporal rhythm can come from separate,
          # explicitly labelled complete routes. The rhythm engine must receive
          # the reference signal when provided.
          report_mod = ecg_structured_report
          originals = (
              report_mod._rhythm_metrics,
              report_mod._axis_metrics,
              report_mod._repolarization_metrics,
              report_mod._lead_evidence,
          )
          seen = {}
          def fake_rhythm(x, fs):
              seen["rhythm_mean_mv"] = float(np.nanmean(x))
              return {"evaluable": False}
          def fake_axis(x, fs):
              seen["axis_mean_mv"] = float(np.nanmean(x))
              return {
                  "evaluable": False,
                  "degrees": None,
                  "category": "NO EVALUABLE",
                  "consistency": None,
              }
          def fake_repol(x, fs):
              return {
                  "per_lead": {},
                  "st_evaluable_leads": [],
                  "st_abnormal_leads": [],
                  "st_isoelectric_compatible": False,
                  "t_evaluable_leads": [],
                  "t_unexpected_polarity_leads": [],
                  "t_normal_polarity_compatible": False,
              }
          def fake_evidence(x, fs):
              return {
                  lead: {"evaluable": False}
                  for lead in report_mod.LEADS
              }
          report_mod._rhythm_metrics = fake_rhythm
          report_mod._axis_metrics = fake_axis
          report_mod._repolarization_metrics = fake_repol
          report_mod._lead_evidence = fake_evidence
          try:
              primary_route = np.zeros((5000, 12), dtype=np.float64)
              temporal_route = np.full((5000, 12), 1000.0, dtype=np.float64)
              dual_report = report_mod.build_structured_ecg_report(
                  primary_route,
                  fs=500,
                  lead_names=report_mod.LEADS,
                  rhythm_signal_uv=temporal_route,
                  rhythm_signal_source="LOW_MEMORY_1200_FORCED_6X2_REFERENCE",
              )
          finally:
              (
                  report_mod._rhythm_metrics,
                  report_mod._axis_metrics,
                  report_mod._repolarization_metrics,
                  report_mod._lead_evidence,
              ) = originals
