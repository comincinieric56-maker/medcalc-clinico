name: MEDCALC ECG AVB2 real per-lead support audit

on:
  push:
    branches: [ecg-avb2-real-dev-transfer-audit]
    paths:
      - "ecg_avb2_real_perlead_support_audit.py"
      - ".github/workflows/medcalc-ecg-avb2-real-perlead-support-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb2-real-perlead-support-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb2-perlead-${{ matrix.fold }}
      - name: Run per-lead support fold ${{ matrix.fold }}
        run: |
          python ecg_avb2_real_perlead_support_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb2-perlead-${{ matrix.fold }} \
            --output /tmp/AVB2_PERLEAD_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-perlead-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB2_PERLEAD_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb2-perlead-fold-*-${{ github.sha }}
          path: /tmp/avb2-perlead
          merge-multiple: false
      - name: Aggregate per-lead support
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path("/tmp/avb2-perlead").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]
          groups={}
          for group in ("AVB2","CONTROL"):
              counts=Counter(); hist=Counter(); codes=Counter()
              for d in docs:
                  g=(d.get("groups") or {}).get(group) or {}
                  counts.update({str(k):int(v) for k,v in (g.get("counts") or {}).items()})
                  hist.update({str(k):int(v) for k,v in (g.get("support_histogram") or {}).items()})
                  codes.update({str(k):int(v) for k,v in (g.get("code_counts") or {}).items()})
              groups[group]={
                  "counts":dict(counts),
                  "support_histogram":dict(hist),
                  "code_counts":dict(codes),
              }
          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})
          out={
              "version":"MEDCALC_AVB2_REAL_PERLEAD_SUPPORT_AUDIT_V1_AGGREGATE",
              "dataset":"PTB-XL","role":"DEVELOPMENT_TUNING_ONLY","folds":[1,2,3,4,5,6,7,8],
              "preferred_av_leads":docs[0]["preferred_av_leads"],
              "fast_gate_holdout_excluded":True,"external_validation_claim_allowed":False,
              "groups":groups,
              "analysis_error_n":sum(errors.values()),
              "analysis_error_types":dict(errors),
              "policy":"EXACT_EXISTING_PER_LEAD_HIGH_RECALL_MAPPING; SUPPORT_DISTRIBUTION_ONLY; NO_SUPPORT_THRESHOLD_SELECTION; ALL_FIXED_CLEAN_CONTROLS; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL",
          }
          Path("/tmp/AVB2_PERLEAD_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb2-perlead-aggregate-${{ github.sha }}
          path: /tmp/AVB2_PERLEAD_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
