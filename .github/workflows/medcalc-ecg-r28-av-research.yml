name: MEDCALC R28 AV research branch
on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_av_event_graph.py"
      - "ecg_av_temporal_model.py"
      - "ecg_av_training_data.py"
      - "ecg_av_train.py"
      - "ecg_av_research_adapter.py"
      - "ecg_av_native_transfer_probe.py"
      - "ecg_av_ludb_event_probe.py"
      - "ecg_av_annotation_source_audit.py"
      - "ecg_av_prepare_development_images.py"
      - "ecg_av_image_preparation_audit.py"
      - "ecg_av_grid_calibration_research.py"
      - "tests/test_ecg_av_grid_calibration_research.py"
      - "ecg_signal_measurements.py"
      - "tests/test_ecg_av_research.py"
      - "tests/test_ecg_av_ludb_event_probe.py"
      - "tests/test_ecg_av_annotation_source_audit.py"
      - "tests/test_ecg_av_prepare_development_images.py"
      - "tests/test_ecg_av_image_preparation_audit.py"
      - ".github/workflows/medcalc-ecg-r28-av-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy scipy neurokit2 pytest opencv-python-headless
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_ecg_av_research.py tests/test_ecg_av_ludb_event_probe.py tests/test_ecg_av_annotation_source_audit.py tests/test_ecg_av_prepare_development_images.py tests/test_ecg_av_image_preparation_audit.py tests/test_ecg_av_grid_calibration_research.py -q
      - name: Training serialization smoke, not a performance gate
        run: python ecg_av_train.py --train-cases 32 --eval-cases 16 --detector-epochs 1 --sequence-epochs 1 --output /tmp/r28-av-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: r28-av-research-training-smoke
          path: /tmp/r28-av-smoke/training_report.json
