name: MEDCALC ECG fast gate 100

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_signal_measurements.py"
      - "ecg_measurement_consensus.py"
      - "ecg_atrial_rhythm.py"
      - "ecg_av_conduction.py"
      - "ecg_crosslead_conduction.py"
      - "ecg_domain_gating.py"
      - "ecg_candidate_detectors.py"
      - "ecg_evidence_fusion.py"
      - "ecg_preexcitation.py"
      - "ecg_reasoner.py"
      - "ecg_fast_gate_100.py"
      - "ecg_fast_gate_100_manifest.json"
      - "ecg_fast_gate_100_baseline.json"
      - "requirements.txt"
      - ".github/workflows/medcalc-ecg-fast-gate-100.yml"
  push:
    branches: [main]
    paths:
      - "ecg_signal_measurements.py"
      - "ecg_measurement_consensus.py"
      - "ecg_atrial_rhythm.py"
      - "ecg_av_conduction.py"
      - "ecg_crosslead_conduction.py"
      - "ecg_domain_gating.py"
      - "ecg_candidate_detectors.py"
      - "ecg_evidence_fusion.py"
      - "ecg_preexcitation.py"
      - "ecg_reasoner.py"
      - "ecg_fast_gate_100.py"
      - "ecg_fast_gate_100_manifest.json"
      - "requirements.txt"
      - ".github/workflows/medcalc-ecg-fast-gate-100.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-ecg-fast-gate-100-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate-100:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore immutable PTB-XL FAST-GATE cache
        uses: actions/cache@v4
        with:
          path: /tmp/medcalc-fast-gate-100
          key: medcalc-ecg-fast-gate-100-ptbxl-v1-${{ hashFiles('ecg_fast_gate_100_manifest.json') }}
      - name: Verify fixed 100-case manifest
        run: python ecg_fast_gate_100.py --selftest
      - name: Guard against tuning the fixed panel
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...{head}"],
                  text=True,
              ).splitlines()
          )
          protected_panel_files = {
              "ecg_fast_gate_100_manifest.json",
              "ecg_fast_gate_100_baseline.json",
          }
          clinical_prefixes = (
              "ecg_signal_measurements.py",
              "ecg_measurement_consensus.py",
              "ecg_atrial_rhythm.py",
              "ecg_av_conduction.py",
              "ecg_crosslead_conduction.py",
              "ecg_domain_gating.py",
              "ecg_candidate_detectors.py",
              "ecg_evidence_fusion.py",
              "ecg_preexcitation.py",
              "ecg_reasoner.py",
          )
          clinical_changed = any(x in changed for x in clinical_prefixes)
          panel_changed = bool(protected_panel_files & changed)

          # Bootstrap PR is allowed to introduce the panel because it does not
          # change clinical logic. Future clinical PRs must evaluate against
          # the already-frozen panel and may not alter its membership.
          if clinical_changed and panel_changed:
              raise SystemExit(
                  "FAST_GATE_100_TUNING_GUARD_FAIL: clinical logic and the "
                  "fixed evaluation manifest changed in the same PR"
              )
          print("FAST_GATE_100_TUNING_GUARD_PASS")
          PY
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Run fixed 100-ECG fast gate
        run: |
          python ecg_fast_gate_100.py             --manifest ecg_fast_gate_100_manifest.json             --workdir /tmp/medcalc-fast-gate-100             --output /tmp/MEDCALC_ECG_FAST_GATE_100.json
      - name: Compare against frozen aggregate baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cur=json.loads(Path("/tmp/MEDCALC_ECG_FAST_GATE_100.json").read_text())
          base=json.loads(Path("ecg_fast_gate_100_baseline.json").read_text())
          cm=cur["metrics"]
          bm=base["metrics"]

          regressions=[]
          if cm["analysis_error_n"] != 0:
              regressions.append(f"analysis_error_n={cm['analysis_error_n']}")
          if cm["overall"]["final_fp_n"] > bm["overall"]["final_fp_n"]:
              regressions.append(
                  f"final_fp_n {cm['overall']['final_fp_n']} > "
                  f"{bm['overall']['final_fp_n']}"
              )
          for target,brow in bm["per_target"].items():
              crow=cm["per_target"][target]
              if crow["final_positive_n"] < brow["final_positive_n"]:
                  regressions.append(
                      f"{target} final_positive_n "
                      f"{crow['final_positive_n']} < {brow['final_positive_n']}"
                  )

          delta={
              "final_tp_delta": (
                  cm["overall"]["final_tp_n"] - bm["overall"]["final_tp_n"]
              ),
              "final_fp_delta": (
                  cm["overall"]["final_fp_n"] - bm["overall"]["final_fp_n"]
              ),
              "per_target_final_delta": {
                  target: (
                      cm["per_target"][target]["final_positive_n"]
                      - brow["final_positive_n"]
                  )
                  for target,brow in bm["per_target"].items()
              },
          }
          improved = (
              delta["final_tp_delta"] > 0
              or delta["final_fp_delta"] < 0
              or any(v > 0 for v in delta["per_target_final_delta"].values())
          )
          print(json.dumps({"delta":delta,"improved":improved},indent=2,sort_keys=True))
          if regressions:
              raise SystemExit(
                  "FAST_GATE_100_REGRESSION: " + "; ".join(regressions)
              )
          print(
              "FAST_GATE_100_COMPARISON_PASS_" +
              ("IMPROVED" if improved else "NO_REGRESSION")
          )
          PY
      - name: Assert development-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/MEDCALC_ECG_FAST_GATE_100.json").read_text())
          assert d["case_count"] == 100, d
          assert d["role"] == "DEVELOPMENT_REGRESSION_ONLY", d
          assert d["external_validation_claim_allowed"] is False, d
          assert d["allowed_folds"] == [1,2,3,4,5,6,7,8], d
          assert d["metrics"]["analysis_error_n"] == 0, d["metrics"]
          print("MEDCALC_ECG_FAST_GATE_100_PROVENANCE_PASS")
          print(json.dumps(d["metrics"], indent=2, sort_keys=True))
          PY
      - name: Upload fast-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-fast-gate-100-${{ github.sha }}
          path: /tmp/MEDCALC_ECG_FAST_GATE_100.json
          if-no-files-found: error
          retention-days: 30
