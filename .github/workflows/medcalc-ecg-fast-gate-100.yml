name: MEDCALC ECG fast gate 100

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_signal_measurements.py"
      - "ecg_measurement_consensus.py"
      - "ecg_atrial_rhythm.py"
      - "ecg_av_conduction.py"
      - "ecg_crosslead_conduction.py"
      - "ecg_domain_gating.py"
      - "ecg_candidate_detectors.py"
      - "ecg_evidence_fusion.py"
      - "ecg_preexcitation.py"
      - "ecg_reasoner.py"
      - "ecg_fast_gate_100.py"
      - "ecg_fast_gate_100_manifest.json"
      - "requirements.txt"
      - ".github/workflows/medcalc-ecg-fast-gate-100.yml"
  push:
    branches: [main]
    paths:
      - "ecg_signal_measurements.py"
      - "ecg_measurement_consensus.py"
      - "ecg_atrial_rhythm.py"
      - "ecg_av_conduction.py"
      - "ecg_crosslead_conduction.py"
      - "ecg_domain_gating.py"
      - "ecg_candidate_detectors.py"
      - "ecg_evidence_fusion.py"
      - "ecg_preexcitation.py"
      - "ecg_reasoner.py"
      - "ecg_fast_gate_100.py"
      - "ecg_fast_gate_100_manifest.json"
      - "requirements.txt"
      - ".github/workflows/medcalc-ecg-fast-gate-100.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-ecg-fast-gate-100-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate-100:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify fixed 100-case manifest
        run: python ecg_fast_gate_100.py --selftest
      - name: Run fixed 100-ECG fast gate
        run: |
          python ecg_fast_gate_100.py             --manifest ecg_fast_gate_100_manifest.json             --workdir /tmp/medcalc-fast-gate-100             --output /tmp/MEDCALC_ECG_FAST_GATE_100.json
      - name: Assert development-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/MEDCALC_ECG_FAST_GATE_100.json").read_text())
          assert d["case_count"] == 100, d
          assert d["role"] == "DEVELOPMENT_REGRESSION_ONLY", d
          assert d["external_validation_claim_allowed"] is False, d
          assert d["allowed_folds"] == [1,2,3,4,5,6,7,8], d
          assert d["metrics"]["analysis_error_n"] == 0, d["metrics"]
          print("MEDCALC_ECG_FAST_GATE_100_PROVENANCE_PASS")
          print(json.dumps(d["metrics"], indent=2, sort_keys=True))
          PY
      - name: Upload fast-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-fast-gate-100-${{ github.sha }}
          path: /tmp/MEDCALC_ECG_FAST_GATE_100.json
          if-no-files-found: error
          retention-days: 30
