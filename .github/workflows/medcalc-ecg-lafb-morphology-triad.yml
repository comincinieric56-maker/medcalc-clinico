name: MEDCALC ECG LAFB morphology triad audit

on:
  push:
    branches:
      - audit/ecg-lafb-morphology-triad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lafb-triad-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile audit
        run: python -m py_compile ecg_lafb_morphology_triad_audit.py
      - name: Run LAFB morphology triad audit
        run: |
          python ecg_lafb_morphology_triad_audit.py             --workdir /tmp/medcalc-lafb-triad             --output /tmp/MEDCALC_LAFB_TRIAD.json
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-lafb-morphology-triad-${{ github.sha }}
          path: /tmp/MEDCALC_LAFB_TRIAD.json
          if-no-files-found: error
          retention-days: 30
