name: MEDCALC ECG fast reviewed-case bootstrap

on:
  push:
    branches:
      - chore/ecg-fast-reviewed-pack-bootstrap
    paths:
      - "ecg_development_regression_case_selector.py"
      - ".github/workflows/medcalc-ecg-fast-reviewed-pack-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-fast-reviewed-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install MEDCALC ECG runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify selector guard
        run: python ecg_development_regression_case_selector.py --selftest
      - name: Select RBBB fusion-loss cases
        run: |
          python ecg_development_regression_case_selector.py             --target RBBB_COMPLETE             --stage CANDIDATE_TO_FUSION_LOSS             --folds 1,2,3,4,5,6,7,8             --max-cases 12             --output /tmp/RBBB_FUSION_LOSS.json
      - name: Select RBBB true positives
        run: |
          python ecg_development_regression_case_selector.py             --target RBBB_COMPLETE             --stage TRUE_POSITIVE             --folds 1,2,3,4,5,6,7,8             --max-cases 6             --output /tmp/RBBB_TRUE_POSITIVE.json
      - name: Select AVB1 candidate misses
        run: |
          python ecg_development_regression_case_selector.py             --target AVB1             --stage CANDIDATE_MISS             --folds 1,2,3,4,5,6,7,8             --max-cases 8             --output /tmp/AVB1_CANDIDATE_MISS.json
      - name: Select WPW fusion-loss cases
        run: |
          python ecg_development_regression_case_selector.py             --target WPW             --stage CANDIDATE_TO_FUSION_LOSS             --folds 1,2,3,4,5,6,7,8             --max-cases 8             --output /tmp/WPW_FUSION_LOSS.json
      - name: Upload reviewed-case selection pack
        uses: actions/upload-artifact@v4
        with:
          name: medcalc-ecg-fast-reviewed-case-bootstrap-${{ github.sha }}
          path: |
            /tmp/RBBB_FUSION_LOSS.json
            /tmp/RBBB_TRUE_POSITIVE.json
            /tmp/AVB1_CANDIDATE_MISS.json
            /tmp/WPW_FUSION_LOSS.json
          if-no-files-found: error
          retention-days: 30
