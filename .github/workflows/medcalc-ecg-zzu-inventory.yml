name: MEDCALC ECG ZZU inventory retired

on:
  pull_request:
    branches: [main]
    paths:
      - "ecg_dataset_provenance.json"
      - "ecg_external_validation_results/ZZU_PECG_PEDIATRIC_DIAGNOSTIC_V1.json"
      - ".github/workflows/medcalc-ecg-zzu-inventory.yml"

permissions:
  contents: read

jobs:
  historical-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify ZZU is consumed
        run: |
          python ecg_validation_guard.py --consumed zzu_pecg

      - name: Confirm historical-only inventory state
        run: echo "MEDCALC_ZZU_INVENTORY_HISTORICAL_ONLY"
