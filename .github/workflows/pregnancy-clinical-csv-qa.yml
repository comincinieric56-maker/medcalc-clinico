name: Pregnancy clinical CSV QA

on:
  pull_request:
    paths:
      - MEDCALC_PREGNANCY_CLINICAL_GUIDANCE_V1.csv
      - MEDCALC_PREGNANCY_CLINICAL_VALIDATE.py
      - .github/workflows/pregnancy-clinical-csv-qa.yml
  push:
    branches:
      - feat/pregnancy-clinical-guidance-batch-01
    paths:
      - MEDCALC_PREGNANCY_CLINICAL_GUIDANCE_V1.csv
      - MEDCALC_PREGNANCY_CLINICAL_VALIDATE.py
      - .github/workflows/pregnancy-clinical-csv-qa.yml

permissions:
  contents: read

jobs:
  pregnancy-csv-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit clinical catalog and evidence pointers
        run: python MEDCALC_PREGNANCY_CLINICAL_VALIDATE.py --strict
