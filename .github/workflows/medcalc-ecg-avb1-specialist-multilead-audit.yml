name: MEDCALC ECG AVB1 specialist multilead audit

on:
  push:
    branches: [ecg-avb1-specialist-multilead-audit]
    paths:
      - "ecg_avb1_specialist_multilead_audit.py"
      - ".github/workflows/medcalc-ecg-avb1-specialist-multilead-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb1-specialist-multilead-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb1-multilead-${{ matrix.fold }}
      - name: Run fold ${{ matrix.fold }}
        run: |
          python ecg_avb1_specialist_multilead_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb1-multilead-${{ matrix.fold }} \
            --output /tmp/AVB1_MULTILEAD_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb1-multilead-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB1_MULTILEAD_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb1-multilead-fold-*-${{ github.sha }}
          path: /tmp/avb1-multilead
          merge-multiple: false
      - name: Aggregate
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path("/tmp/avb1-multilead").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]
          groups={}
          for group in ("AVB1","CONTROL"):
              c=Counter()
              for d in docs:
                  c.update({str(k):int(v) for k,v in ((d.get("groups") or {}).get(group) or {}).items()})
              groups[group]=dict(c)
          errors=Counter()
          for d in docs:
              errors.update({str(k):int(v) for k,v in (d.get("analysis_error_types") or {}).items()})
          p=groups["AVB1"]; n=groups["CONTROL"]
          def projection(rescue_key):
              base_tp=int(p.get("baseline_final_n") or 0)
              add_tp=int(p.get(rescue_key) or 0)
              base_fp=int(n.get("baseline_final_n") or 0)
              add_fp=int(n.get(rescue_key) or 0)
              pn=int(p.get("n") or 0); nn=int(n.get("n") or 0)
              return {
                  "baseline_tp_n":base_tp,"incremental_tp_n":add_tp,
                  "projected_tp_n":base_tp+add_tp,
                  "positive_n":pn,
                  "projected_sensitivity":(base_tp+add_tp)/pn if pn else None,
                  "baseline_fp_n":base_fp,"incremental_fp_n":add_fp,
                  "projected_fp_n":base_fp+add_fp,
                  "negative_control_n":nn,
                  "projected_specificity":1.0-(base_fp+add_fp)/nn if nn else None,
              }
          out={
              "version":"MEDCALC_AVB1_SPECIALIST_MULTILEAD_AUDIT_V1_AGGREGATE",
              "dataset":"PTB-XL","role":"DEVELOPMENT_TUNING_ONLY","folds":[1,2,3,4,5,6,7,8],
              "fast_gate_holdout_excluded":True,"external_validation_claim_allowed":False,
              "groups":groups,
              "analysis_error_n":sum(errors.values()),"analysis_error_types":dict(errors),
              "projection_ge2_long_pr":projection("rescue_ge2_long_pr_n"),
              "projection_ge2_and_median_gt200":projection("rescue_ge2_and_median_gt200_n"),
              "policy":"AUDIT_ONLY; EXISTING_GE2_PR_GT_200_LEADS_AND_CONF_GE_0_50; EXISTING_200MS_THRESHOLD; FOLDS_1_TO_8_ONLY; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL; NO_CLINICAL_OUTPUT_CHANGE",
          }
          Path("/tmp/AVB1_MULTILEAD_AGGREGATE.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb1-multilead-aggregate-${{ github.sha }}
          path: /tmp/AVB1_MULTILEAD_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
