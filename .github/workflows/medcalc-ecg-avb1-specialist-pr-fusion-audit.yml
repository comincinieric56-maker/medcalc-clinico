name: MEDCALC ECG AVB1 specialist PR fusion audit

on:
  push:
    branches: [ecg-avb1-specialist-pr-fusion-audit]
    paths:
      - "ecg_avb1_specialist_pr_fusion_audit.py"
      - ".github/workflows/medcalc-ecg-avb1-specialist-pr-fusion-audit.yml"
  workflow_dispatch:

concurrency:
  group: medcalc-avb1-specialist-pr-fusion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fold:
    strategy:
      fail-fast: false
      matrix:
        fold: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Restore PTB-XL development cache
        uses: ./.github/actions/ecg-ptbxl-development-cache
        with:
          path: /tmp/medcalc-avb1-specialist-${{ matrix.fold }}
      - name: Run AVB1 specialist PR fusion audit fold ${{ matrix.fold }}
        run: |
          python ecg_avb1_specialist_pr_fusion_audit.py \
            --process-fold ${{ matrix.fold }} \
            --workdir /tmp/medcalc-avb1-specialist-${{ matrix.fold }} \
            --output /tmp/AVB1_SPECIALIST_FOLD_${{ matrix.fold }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: avb1-specialist-fold-${{ matrix.fold }}-${{ github.sha }}
          path: /tmp/AVB1_SPECIALIST_FOLD_${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avb1-specialist-fold-*-${{ github.sha }}
          path: /tmp/avb1-specialist
          merge-multiple: false
      - name: Aggregate AVB1 specialist rescue
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          files=sorted(Path("/tmp/avb1-specialist").glob("**/*.json"))
          assert len(files)==8,files
          docs=[json.loads(p.read_text()) for p in files]
          assert sorted(int(d["process_fold"]) for d in docs)==[1,2,3,4,5,6,7,8]

          groups={}
          for group in ("AVB1","CONTROL"):
              c=Counter()
              for d in docs:
                  c.update({
                      str(k):int(v)
                      for k,v in ((d.get("groups") or {}).get(group) or {}).items()
                  })
              groups[group]=dict(c)

          errors=Counter()
          for d in docs:
              errors.update({
                  str(k):int(v)
                  for k,v in (d.get("analysis_error_types") or {}).items()
              })

          p=groups["AVB1"]; n=groups["CONTROL"]
          baseline_tp=int(p.get("final_published_n") or 0)
          rescue_tp=int(p.get("specialist_pr_only_rescue_n") or 0)
          baseline_fp=int(n.get("final_published_n") or 0)
          rescue_fp=int(n.get("specialist_pr_only_rescue_n") or 0)
          pos_n=int(p.get("n") or 0)
          neg_n=int(n.get("n") or 0)

          multilead_projections={}
          for required_n in (2,3,4,5,6):
              key=f"specialist_pr_only_rescue_ge{required_n}_pr_gt_200_leads_n"
              tp=int(p.get(key) or 0)
              fp=int(n.get(key) or 0)
              multilead_projections[f"GE_{required_n}_PR_GT_200_LEADS_CONF_GE_0_50"]={
                  "rescue_tp_n":tp,
                  "incremental_fp_n":fp,
                  "projected_tp_n":baseline_tp+tp,
                  "projected_fp_n":baseline_fp+fp,
                  "projected_sensitivity":(baseline_tp+tp)/pos_n if pos_n else None,
                  "projected_specificity":1.0-(baseline_fp+fp)/neg_n if neg_n else None,
              }

          structural_policy_projections={}
          policy_names=(
              "UNUSABLE_GE2_LONG",
              "UNUSABLE_GE2_LONG_MEDIAN_GT200",
              "UNUSABLE_GE2_LONG_MEDIAN_GT200_MAD_LE20",
              "UNCERTAIN_GE2_LONG_MEDIAN_GT200",
              "GE2_LONG_MEDIAN_GT200_MAD_LE20",
              "GE4_LONG_MEDIAN_GT200_MAD_LE20",
              "GE2_LONG_MEDIAN_GT200_MAD_LE20_DIFF_LE40",
          )
          for name in policy_names:
              key=f"specialist_pr_only_policy:{name}"
              tp=int(p.get(key) or 0)
              fp=int(n.get(key) or 0)
              structural_policy_projections[name]={
                  "rescue_tp_n":tp,
                  "incremental_fp_n":fp,
                  "projected_tp_n":baseline_tp+tp,
                  "projected_fp_n":baseline_fp+fp,
                  "projected_sensitivity":(baseline_tp+tp)/pos_n if pos_n else None,
                  "projected_specificity":1.0-(baseline_fp+fp)/neg_n if neg_n else None,
              }

          out={
              "version":"MEDCALC_AVB1_SPECIALIST_PR_FUSION_AUDIT_V3_AGGREGATE",
              "dataset":"PTB-XL",
              "role":"DEVELOPMENT_TUNING_ONLY",
              "folds":[1,2,3,4,5,6,7,8],
              "fast_gate_holdout_excluded":True,
              "external_validation_claim_allowed":False,
              "groups":groups,
              "analysis_error_n":sum(errors.values()),
              "analysis_error_types":dict(errors),
              "projection":{
                  "baseline_tp_n":baseline_tp,
                  "rescue_tp_n":rescue_tp,
                  "projected_tp_n":baseline_tp+rescue_tp,
                  "positive_n":pos_n,
                  "baseline_sensitivity":baseline_tp/pos_n if pos_n else None,
                  "projected_sensitivity":(baseline_tp+rescue_tp)/pos_n if pos_n else None,
                  "baseline_fp_n":baseline_fp,
                  "incremental_fp_n":rescue_fp,
                  "projected_fp_n":baseline_fp+rescue_fp,
                  "negative_control_n":neg_n,
                  "baseline_specificity":1.0-baseline_fp/neg_n if neg_n else None,
                  "projected_specificity":1.0-(baseline_fp+rescue_fp)/neg_n if neg_n else None,
                  "specificity_guardrail":0.90
              },
              "multilead_pr_support_projections":multilead_projections,
              "structural_pr_consensus_policy_projections":structural_policy_projections,
              "clinical_output_changed":False,
              "policy":"COUNTERFACTUAL_AUDIT_ONLY; SPECIALIST_CONFIRMED; PR_ONLY_FUSION_BLOCK; DOMAIN_SCORE_SOURCE_REQUIREMENTS_PRESERVED; EXISTING_PR_LEAD_CONFIDENCE_FLOOR_0_50; EXISTING_PR_CONSENSUS_TOLERANCE_20MS_AND_STRONG_DISCORDANCE_LIMITS; STRUCTURAL_POLICY_CHARACTERIZATION_ONLY; FOLDS_1_TO_8; FAST_EXCLUDED; NO_FOLD9_10_OR_EXTERNAL"
          }
          Path("/tmp/AVB1_SPECIALIST_AGGREGATE.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb1-specialist-aggregate-${{ github.sha }}
          path: /tmp/AVB1_SPECIALIST_AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
