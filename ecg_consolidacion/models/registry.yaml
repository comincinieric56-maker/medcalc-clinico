# Los PESOS NO viven en este repo: siguen en Google Drive (MyDrive/MEDCALC/...).
# Aquí solo hay punteros + SHA-256.
#
# sha_status:
#   VERIFIED_2026-11-17  -> SHA recalculado sobre el archivo descargado de Drive
#                          y coincide con el declarado por el proyecto.
#   RECORDED_2026-11-17  -> SHA calculado por primera vez (no había valor declarado).
#   DECLARED_ONLY        -> SHA tomado de un JSON/MD del proyecto; falta
#                          recalcularlo con tools/verify_drive_artifacts.py.
#
# status (clasificación del brief de auditoría):
#   RC  referencia congelada      EXP experimental
#   VI  validado internamente     VE  validado externamente (ninguno hoy)
#   OBS obsoleto/sustituido       PE  pendiente de evaluación
#
# Reglas: cambiar un `sha256` o un `frozen: true` requiere aprobación de
# CODEOWNERS y actualizar frozen/FROZEN.lock.json en el mismo PR.
# ---------------------------------------------------------------------------
