# Patrones que la CI trata como acceso a conjuntos reservados (tools/check_reserved_paths.py).
# any: basta con que aparezca un patrón.  all: deben aparecer todos en el mismo archivo.
# Excepción explícita, en el propio archivo:
#   # reserved-access-approved: <dataset_id> PR#<número>
reserved_path_patterns:
  ludb_trihead_test:
    all: ['SPLIT_PATIENTS_LOCKED|splits_LUDB_TRIHEAD', '\[\s*[''"]test[''"]\s*\]']
  ptb_qt400:
    any: ['QT[_-]?400', 'PTB[_-]?400']
  heedb:
    any: ['(?i)heedb', '(?i)bdsp']
  code_test:
    any: ['(?i)code[_-]?test']
  sph:
    any: ['\bSPH\b', '(?i)shandong']
  zzu_pecg:
    any: ['(?i)\bzzu']
  sciencedb:
    any: ['(?i)sciencedb']
