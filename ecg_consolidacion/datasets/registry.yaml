# MEDCALC EKG — Registro canónico de conjuntos de datos (F1)
# ---------------------------------------------------------------------------
# Estado de uso por conjunto. Regla: un conjunto CONSUMED o DEV no puede
# volver a usarse para afirmar validación externa, ni para elegir modelo,
# umbral o hiperparámetro si está marcado como reserved.
#
# usage_status:
#   FRESH              nunca abierto por ninguna línea (candidato a externo)
#   LOCKED_FRESH       reservado antes de abrirlo; protocolo pendiente
#   DEV                desarrollo (entrenamiento/selección) en alguna línea
#   CONSUMED           ya usado como prueba/externo: solo histórico
#
# Integra ecg_dataset_provenance.json del repo medcalc-clinico (2026-11-17)
# y lo hallado en Drive durante la auditoría del 2026-11-15.
# ---------------------------------------------------------------------------
